[package]
name = "phonetic_spellcheck"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["Dylon Edwards <dylon.devo@gmail.com>"]
description = "Demo of PhoneticNormalizedDictionary with combined English phonetic rules"
readme = "README.md"
publish = false  # Example, not for publishing

[dependencies]
liblevenshtein = { path = "../..", features = ["phonetic-rules", "pathmap-backend", "embedded-rules"] }

[[bin]]
name = "phonetic_spellcheck"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true

# Standalone example - not part of parent workspace
[workspace]
