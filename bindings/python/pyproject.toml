[build-system]
requires = ["setuptools>=77", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "liblevenshtein"
version = "4.0.0rc5"
description = "Fast streaming fuzzy search backed by liblevenshtein"
requires-python = ">=3.10"
license = "Apache-2.0"
readme = "README.md"
authors = [{ name = "Dylon Edwards", email = "dylon.devo@gmail.com" }]
keywords = ["levenshtein", "fuzzy-search", "streaming", "snapshot"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Libraries",
  "Topic :: Text Processing",
]
dependencies = ["vinary-tree-interop==4.0.0rc5"]

[project.optional-dependencies]
# C8/C9 dev tooling: Hypothesis drives the property suite (tests/test_property.py);
# the leak suite (tests/test_leak.py) relies only on the stdlib (tracemalloc, gc).
test = ["pytest>=8", "hypothesis>=6"]

[dependency-groups]
documentation = ["pdoc==16.0.0"]

[project.urls]
Homepage = "https://github.com/vinary-tree/liblevenshtein-rust"
Documentation = "https://github.com/vinary-tree/liblevenshtein-rust/tree/master/bindings/python"
Repository = "https://github.com/vinary-tree/liblevenshtein-rust"
Issues = "https://github.com/vinary-tree/liblevenshtein-rust/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
liblevenshtein = ["LICENSE", "py.typed", "native/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
