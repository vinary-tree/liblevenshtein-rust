name: Pin family crates to crates.io
description: >
  Drop development-only local `path` overrides from `vinary-tree-interop` and
  `libdictenstein` so production builds and packaging resolve exact published
  crates.io versions
  requirement. For release / production workflows only; development and CI use
  the sibling checkouts instead (see the `checkout-dev-siblings` action).

runs:
  using: composite
  steps:
    - name: Strip dev-only path overrides from family dependencies
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import pathlib
        import re

        manifest = pathlib.Path("Cargo.toml")
        before = manifest.read_text()
        after = before
        for dependency in ("vinary-tree-interop", "libdictenstein"):
            after, count = re.subn(
                rf'{dependency} = \{{ path = "\.\./{dependency}", (version = "[^"]+")',
                rf'{dependency} = {{ \1',
                after,
            )
            if count != 1:
                raise SystemExit(f"ERROR: expected one dev path override for {dependency}")
        if after == before:
            raise SystemExit(
                "ERROR: expected dev path overrides, but none were found. "
                "update .github/actions/pin-siblings-cratesio/action.yml."
            )
        manifest.write_text(after)
        PY
        cargo generate-lockfile
        echo "Family dependencies now resolve from crates.io:"
        grep -nE '^(vinary-tree-interop|libdictenstein) =' Cargo.toml
