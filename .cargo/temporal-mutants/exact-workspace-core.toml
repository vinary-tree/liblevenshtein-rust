examine_globs = [
  "src/time_series/elastic/mod.rs",
  "src/time_series/automaton/column.rs",
  "src/time_series/msm_kernel.rs",
  "src/time_series/kernels/frechet.rs",
  "src/time_series/kernels/dtw.rs",
]
examine_re = [
  "replace ExactPointWorkspace<K>::storage ->",
  "replace ExactPointWorkspace<K>::retained_bytes -> usize with [01]",
  "replace ExactPointWorkspace<K>::construction_peak_bytes -> usize with [01]",
  "replace > with (==|<|>=) in ExactPointWorkspace<K>::try_new",
  "replace ExactPointWorkspace<K>::reset with ()",
  "replace ExactPointWorkspace<K>::clear_next_generation with ()",
  "replace ElasticKernel::alignment_is_structurally_possible -> bool with false",
  "replace <impl ElasticKernel for MsmKernel>::alignment_is_structurally_possible -> bool with false",
  "replace <impl ElasticKernel for FrechetConfig>::alignment_is_structurally_possible -> bool with false",
  "replace <impl ElasticKernel for DtwConfig>::alignment_is_structurally_possible -> bool with false",
  "delete ! in ExactPointWorkspace<K>::score_candidate",
  "replace == with != in ExactPointWorkspace<K>::score_candidate",
  "replace match guard !structurally_possible .* with true in classify_exact",
  "delete ! in classify_exact",
]
additional_cargo_args = [
  "--locked",
  "--offline",
  "--test=proptest_query_plan_workspace",
]
test_package = ["liblevenshtein"]
copy_target = false
copy_vcs = false
gitignore = true
minimum_test_timeout = 60.0
timeout_multiplier = 3.0
