<text x="487.500000" y="-16.000000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:28px">Two read paths: wait-free ArcSwap vs RwLock</text></g><g class="bGFuZUE="><g class="shape" ><rect x="12.000000" y="12.000000" width="444.000000" height="620.000000" stroke="#2E7D32" fill="#E8F5E9" style="stroke-width:2;" /></g><text x="234.000000" y="45.000000" fill="#102027" class="text" style="text-anchor:middle;font-size:28px">Lane A — ArcSwap (wait-free read)</text></g><g class="bGFuZUI="><g class="shape" ><rect x="476.000000" y="12.000000" width="488.000000" height="620.000000" stroke="#455A64" fill="#ECEFF1" style="stroke-width:2;" /></g><text x="720.000000" y="45.000000" fill="#102027" class="text" style="text-anchor:middle;font-size:28px">Lane B — RwLock (parking_lot)</text></g><g class="bGFuZUEucmxvYWQ="><g class="shape" ><rect x="117.000000" y="289.000000" width="234.000000" height="66.000000" stroke="#2E7D32" fill="#E8F5E9" style="stroke-width:2;" /></g><text x="234.000000" y="327.500000" fill="#102027" class="text-bold" style="text-anchor:middle;font-size:16px">reader: atomic load Arc&lt;T&gt;</text></g><g class="bGFuZUEucnVzZQ=="><g class="shape" ><rect x="117.000000" y="516.000000" width="234.000000" height="66.000000" stroke="#2E7D32" fill="#E8F5E9" style="stroke-width:2;" /></g><text x="234.000000" y="554.500000" fill="#102027" class="text-bold" style="text-anchor:middle;font-size:16px">use snapshot (no blocking)</text></g><g class="bGFuZUEud3N3YXA="><g class="shape" ><rect x="62.000000" y="62.000000" width="344.000000" height="66.000000" stroke="#2E7D32" fill="#E8F5E9" style="stroke-width:2;" /></g><text x="234.000000" y="100.500000" fill="#102027" class="text-bold" style="text-anchor:middle;font-size:16px">writer: build new Arc → atomic swap (RCU)</text></g><g class="bGFuZUIucmFjcQ=="><g class="shape" ><rect x="526.000000" y="289.000000" width="388.000000" height="66.000000" stroke="#455A64" fill="#ECEFF1" style="stroke-width:2;" /