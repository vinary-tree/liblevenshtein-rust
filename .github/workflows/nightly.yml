name: Nightly

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-dev-siblings
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo test --locked --all-features --all-targets

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-dev-siblings
      - uses: dtolnay/rust-toolchain@stable
      # cargo-deny-action runs in a container that cannot see path dependencies
      # checked out beside the host workspace. Install the CLI on the host.
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - run: cargo deny --locked check
