<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="300px" preserveAspectRatio="none" style="width:1101px;height:300px;background:#FFFFFF;" version="1.1" viewBox="0 0 1101 300" width="1101px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><g class="title" data-source-line="23"><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="417.1836" x="338.7182" y="22.9951">MSM metric &#8212; edit a series with Move / Split / Merge</text></g><!--cluster title--><g class="cluster" data-qualified-name="title" data-source-line="25" id="ent0001"><rect fill="#B2DFDB" height="119.6" rx="7" ry="7" style="stroke:#455A64;stroke-width:1;" width="885" x="7" y="44.2969"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="403.9082" x="247.5459" y="59.292">MSM metric: edit a series with Move / Split / Merge</text></g><!--entity move--><g class="entity" data-qualified-name="title.move" data-source-line="26" id="ent0002"><rect fill="#E0F2F1" height="52.5938" rx="7" ry="7" style="stroke:#455A64;stroke-width:0.5;" width="236.2891" x="30.86" y="87.2969"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="216.2891" x="40.86" y="110.292">Move &#8212; change a value  x&#7522; &#8594; y</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="109.7373" x="40.86" y="126.5889">(cost = |x&#7522; &#8722; y|)</text></g><!--entity split--><g class="entity" data-qualified-name="title.split" data-source-line="27" id="ent0003"><rect fill="#E0F2F1" height="52.5938" rx="7" ry="7" style="stroke:#455A64;stroke-width:0.5;" width="238.2168" x="301.89" y="87.2969"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="218.2168" x="311.89" y="110.292">Split &#8212; one value &#8594; two copies</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="138.0654" x="311.89" y="126.5889">(cost = c + |x&#7522; &#8722; y|)</text></g><!--entity merge--><g class="entity" data-qualified-name="title.merge" data-source-line="28" id="ent0004"><rect fill="#E0F2F1" height="52.5938" rx="7" ry="7" style="stroke:#455A64;stroke-width:0.5;" width="274.0781" x="574.96" y="87.2969"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="254.0781" x="584.96" y="110.292">Merge &#8212; two adjacent values &#8594; one</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="140.5127" x="584.96" y="126.5889">(cost = c + |x&#7522; &#8722; x&#11388;|)</text></g><g class="entity" data-qualified-name="GMN7" data-source-line="35" id="ent0008"><path d="M681.39,199.8969 L681.39,285.5609 L1086.62,285.5609 L1086.62,209.8969 L1076.62,199.8969 L681.39,199.8969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1076.62,199.8969 L1076.62,209.8969 L1086.62,209.8969 L1076.62,199.8969" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="288.1582" x="687.39" y="216.9638">MSM distance = minimum total cost over all</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="312.457" x="687.39" y="232.0966">Move / Split / Merge transformations of X into Y.</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="302.415" x="687.39" y="247.2294">Stefan, Athitsos &amp; Das, "The Move-Split-Merge</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="384.23" x="687.39" y="262.3622">Metric for Time Series", IEEE TKDE 25(6):1425-1438, 2013.</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="178.9277" x="687.39" y="277.495">DOI 10.1109/TKDE.2012.88</text></g><!--link move to split--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="31" id="lnk5"><path d="M267.47,113.5969 C278.86,113.5969 285.26,113.5969 296.65,113.5969" fill="none" id="move-to-split" style="stroke:#00695C;stroke-width:2;"/><polygon fill="#00695C" points="301.65,113.5969,292.65,109.5969,296.65,113.5969,292.65,117.5969,301.65,113.5969" style="stroke:#00695C;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link split to merge--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="32" id="lnk6"><path d="M540.36,113.5969 C551.75,113.5969 558.15,113.5969 569.55,113.5969" fill="none" id="split-to-merge" style="stroke:#00695C;stroke-width:2;"/><polygon fill="#00695C" points="574.55,113.5969,565.55,109.5969,569.55,113.5969,565.55,117.5969,574.55,113.5969" style="stroke:#00695C;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link title to GMN7--><g class="link" data-entity-1="ent0001" data-entity-2="ent0008" data-link-type="association" data-source-line="35" id="lnk9"><path d="M884,164.2852 C884,166.6097 884,168.9603 884,171.3236 C884,180.7769 884,190.4344 884,199.4469" fill="none" id="title-GMN7" style="stroke:#37474F;stroke-width:2;stroke-dasharray:7,7;"/></g></g></svg>