  #       # cargo clippy --no-deps --all-features -- -D warnings
  #       cargo clippy --no-deps -- -D warnings

  wasm:
    name: WASM Build Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Checkout dev sibling crates
      uses: ./.github/actions/checkout-dev-siblings

    - name: Install Rust toolchain (wasm32-unknown-unknown)
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: nightly
        target: wasm32-unknown-unknown

    - name: Check wasm build (--features wasm)
      # The `wasm` feature targets browser/Node via wasm-bindgen. getrandom 0.4's
      # web RNG backend is selected by the getrandom_backend="wasm_js" cfg in
      # .cargo/config.toml under [target.wasm32-unknown-unknown]. Do NOT set
      # RUSTFLAGS here — it would override that target-specific rustflags entry
      # and drop the cfg (and would also apply the invalid target-cpu=native to
      # wasm), breaking the build.
      run: cargo check --target wasm32-unknown-unknown --features wasm --verbose

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    env:
      RUSTFLAGS: "-C target-feature=+aes,+sse2"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Checkout dev sibling crates
      uses: ./.github/actions/checkout-dev-siblings

    - name: Install system dependencies
      # --all-features pulls in leptess (leptonica-sys/tesseract-sys), which need
      # the Leptonica + Tesseract dev libraries at build time, plus protobuf.
      run: |
        sudo add-apt-repository -y ppa:alex-p/tesseract-ocr5
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler libleptonica-dev tesseract-ocr libtesseract-dev

    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: nightly
        target: x86_64-unknown-linux-gnu
        components: rustfmt, clippy

    - name: Compile-check benchmarks
      # Build every bench target (dev profile, no LTO) to catch bench rot against
      # the current API — fast (minutes). The full statistical `cargo bench` run
      # is release+LTO over ~50 benches and takes hours, so it is intentionally
      # NOT run in CI; perf measurement is done deliberately and CPU-pinned
      # locally (see the project's benchmarking methodology).
      run: cargo build --benches --all-features --target x86_64-unknown-linux-gnu

  test-report:
    name: Test Report Summary
    runs-on: ubuntu-latest
    # needs: [test, lint, benchmarks]
    needs: [test, wasm, benchmarks]
    if: always()

    steps:
    - name: Download benchmark results
      if: needs.benchmarks.result == 'success'
      uses: actions/download-artifact@v4
      with:
        name: benchmark-results
        path: ./benchmark-results
      continue-on-error: true

    - name: Generate summary
      run: |
        echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Tests | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| WASM | ${{ needs.wasm.result }} |" >> $GITHUB_STEP_SUMMARY
        # echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Benchmarks | ${{ needs.benchmarks.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        # if [ "${{ needs.test.result }}" == "success" ] && [ "${{ needs.lint.result }}" == "success" ]; then
        #   echo "✅ All checks passed!" >> $GITHUB_STEP_SUMMARY
        # else
        #   echo "❌ Some checks failed. Please review the logs." >> $GITHUB_STEP_SUMMARY
        # fi

        echo "" >> $GITHUB_STEP_SUMMARY

        # Include benchmark summary if available
        if [ -f "./benchmark-results/benchmark-summary.md" ]; then
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat ./benchmark-results/benchmark-summary.md >> $GITHUB_STEP_SUMMARY
        elif [ "${{ needs.benchmarks.result }}" == "skipped" ]; then
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⏭️ Benchmarks skipped (only run on master branch)" >> $GITHUB_STEP_SUMMARY
        fi
