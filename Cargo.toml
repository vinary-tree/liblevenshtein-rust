[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = true  # Enable debug symbols for profiling

[profile.bench]
inherits = "release"

[features]
default = ["parking_lot"]
bindings-core = ["dep:vinary-tree-interop"]
bindings-phonetic = ["bindings-core", "phonetic-rules"]
pathmap-backend = ["pathmap", "libdictenstein/pathmap-backend"]
serialization = ["serde", "bincode", "libdictenstein/serialization"]
protobuf = ["prost", "bytes", "prost-build", "serialization", "libdictenstein/protobuf"]
compression = ["flate2", "serialization", "libdictenstein/compression"]
phonetic-rules = ["unicode-normalization"]  # Phonetic rewrite rules with formal verification
embedded-rules = ["phonetic-rules"]  # Pre-compiled English phonetic rules embedded in binary
parallel-grep = ["rayon", "phonetic-rules"]  # Parallel phonetic grep with Rayon for multi-core document scanning
perf-instrumentation = ["benchmark-controls", "libdictenstein/perf-instrumentation"]  # Causal work counters (dev only); implies same-binary controls
resource-profiling = ["benchmark-controls", "bindings-core", "libdictenstein/bindings-core"]  # Headless resource timing; implies same-binary controls
benchmark-controls = ["libdictenstein/benchmark-controls"]  # Same-binary A/B switches without causal counters
causal-resource-profiling = [
    "resource-profiling",
    "perf-instrumentation",
]

# Eviction wrapper optimization features
eviction-parking-lot = ["parking_lot"]
eviction-dashmap = ["dashmap"]
eviction-arc-str = []
eviction-compact-metadata = []
eviction-coarse-timestamps = []

# Eviction optimization profiles
eviction-opt-none = []
eviction-opt-balanced = ["eviction-parking-lot", "eviction-arc-str", "eviction-compact-metadata"]
eviction-opt-concurrent = ["eviction-dashmap", "eviction-parking-lot", "eviction-arc-str", "eviction-compact-metadata"]
eviction-opt-memory = ["eviction-compact-metadata"]

# Persistent Adaptive Radix Trie (disk-based dictionary)
persistent-artrie = ["memmap2", "parking_lot", "serde", "bincode", "libdictenstein/persistent-artrie"]

# WASM support - enables wasm-bindgen bindings for JavaScript
wasm = ["bindings-core", "wasm-bindgen", "serde-wasm-bindgen", "console_error_panic_hook", "getrandom", "getrandom-03", "js-sys", "serde"]
# WASM with full phonetic support
wasm-phonetic = ["wasm", "phonetic-rules"]
# C FFI support - exposes raw C-compatible functions (for WASI or native FFI)
ffi = ["bindings-core"]
# Combined WASM + FFI
wasm-ffi = ["wasm", "ffi"]

# Language-facing aliases. Managed packages remain separate distributions;
# these names select only the Rust export boundary they consume.
native-bindings-full = [
    "ffi",
    "bindings-phonetic",
]
# Test-only cross-project producer/consumer surface. This is deliberately not
# included by a publishable language alias: liblevenshtein consumes the ABI and
# does not export libdictenstein's constructors or CRUD.
binding-integration-tests = ["native-bindings-full", "libdictenstein/bindings-core"]
binding-persistent-integration-tests = [
    "binding-integration-tests",
    "serialization",
    "libdictenstein/persistent-artrie",
]
c-bindings = ["native-bindings-full"]
cpp-bindings = ["native-bindings-full"]
python-bindings = ["native-bindings-full"]
jvm-bindings = ["native-bindings-full"]
clojure-bindings = ["jvm-bindings"]
dotnet-bindings = ["native-bindings-full"]
go-bindings = ["native-bindings-full"]
swift-bindings = ["native-bindings-full"]
ruby-bindings = ["native-bindings-full"]
fortran-bindings = ["native-bindings-full"]
ocaml-bindings = ["native-bindings-full"]
haskell-bindings = ["native-bindings-full"]
lua-bindings = ["native-bindings-full"]
javascript-bindings = ["wasm", "bindings-phonetic"]
typescript-bindings = ["javascript-bindings"]
clojurescript-bindings = ["javascript-bindings"]

# For local development: uncomment this section to use a local PathMap checkout
