[package]
name = "vinary-tree-interop"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
authors = ["Dylon Edwards <dylon.devo@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/vinary-tree/liblevenshtein-rust"
description = "Stable resource ABI shared by modular vinary-tree language bindings"
keywords = ["ffi", "bindings", "abi", "vinary-tree"]
categories = ["api-bindings", "development-tools::ffi"]
readme = "README.md"

[lib]
name = "vinary_tree_interop"
path = "src/lib.rs"

[features]
default = []
