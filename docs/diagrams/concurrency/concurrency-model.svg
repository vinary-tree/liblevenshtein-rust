<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="375px" preserveAspectRatio="none" style="width:2500px;height:375px;background:#FFFFFF;" version="1.1" viewBox="0 0 2500 375" width="2500px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><g class="title" data-source-line="26"><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="601.7676" x="946.0637" y="22.9951">Concurrency model &#8212; dictionary reads grouped by synchronization strategy</text></g><!--cluster gfree--><g class="cluster" data-qualified-name="gfree" data-source-line="30" id="ent0002"><rect fill="#CFD8DC" height="256.87" rx="7" ry="7" style="stroke:#455A64;stroke-width:1;" width="971" x="7" y="104.5969"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="457.6045" x="263.6978" y="119.592">Lock-free / wait-free reads &#8212; readers never block a writer</text></g><!--cluster glock--><g class="cluster" data-qualified-name="glock" data-source-line="39" id="ent0009"><rect fill="#CFD8DC" height="248.72" rx="7" ry="7" style="stroke:#455A64;stroke-width:1;" width="960" x="1018" y="104.5969"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="661.1924" x="1167.4038" y="119.592">RwLock readers (parking_lot &#183; ExternalSync) &#8212; reads block only a concurrent writer</text></g><!--entity dat--><g class="entity" data-qualified-name="gfree.dat" data-source-line="31" id="ent0003"><rect fill="#E8F5E9" height="52.5938" rx="7" ry="7" style="stroke:#455A64;stroke-width:0.5;" width="273.8525" x="31.07" y="147.5969"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="158.2793" x="41.07" y="170.592">DoubleArrayTrie(Char)</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="253.8525" x="41.07" y="186.8889">immutable array &#183; &#119978;(1) reads &#183; static</text></g><!--entity ddu64--><g class="entity" data-qualified-name="gfree.ddu64" data-source-line="32" id="ent0004"><rect fill="#E8F5E9" height="52.5938" rx="7" ry="7" style="stroke:#455A64;stroke-width:0.5;" width="271.2617" x="340.37" y="147.5969"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="129.5" x="350.37" y="170.592">DynamicDawgU64</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="251.2617" x="350.37" y="186.8889">per-node ArcSwap RCU &#183; CAS writes</text></g><!--entity pms--><g class="entity" data-qualified-name="gfree.pms" data-source-line="33" id="ent0005"><rect fill="#E8F5E9" height="52.5938" rx="7" ry="7" style="stroke:#455A64;stroke-width:0.5;" width="288.0986" x="646.95" y="147.5969"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="268.0986" x="656.95" y="170.592">PathMapSnapshot / PathMapRef(Char)</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="239.1279" x="656.95" y="186.8889">persistent copy-on-write snapshot</text></g><!--entity part--><g class="entity" data-qualified-name="gfree.part" data-source-line="34" id="ent0006"><rect fill="#E0F2F1" height="52.5938" rx="7" ry="7" style="stroke:#455A64;stroke-width:0.5;" width="228.4277" x="30.79" y="276.7269"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="201.4551" x="40.79" y="299.722">PersistentARTrie(Char / U64)</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="208.4277" x="40.79" y="316.0189">lock-free CAS overlay &#183; mmap</text></g><!--entity psub--><g class="entity" data-qualified-name="gfree.psub" data-source-line="35" id="ent0007"><rect fill="#E0F2F1" height="68.8906" rx="7" ry="7" style="stroke:#455A64;stroke-width:0.5;" width="354.1201" x="293.94" y="268.5769"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="334.1201" x="303.94" y="291.572">PersistentScdawg / PersistentSuffixAutomaton /</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="184.9873" x="303.94" y="307.8689">PersistentSuffixTree(Char)</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="217.5674" x="303.94" y="324.1657">ArcSwap graph &#183; disk-persisted</text></g><!--entity pv--><g class="entity" data-qualified-name="gfree.pv" data-source-line="36" id="ent0008"><rect fill="#E0F2F1" height="52.5938" rx="7" ry="7" style="stroke:#455A64;stroke-width:0.5;" width="259.4287" x="683.29" y="276.7269"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="159.1748" x="693.29" y="299.722">PersistentVocabARTrie</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="239.4287" x="693.29" y="316.0189">lock-free overlay &#183; term &#8596; id &#183; disk</text></g><!--entity dd--><g class="entity" data-qualified-name="glock.dd" data-source-line="40" id="ent0010"><rect fill="#E8F5E9" height="52.5938" rx="7" ry="7" style="stroke:#455A64;stroke-width:0.5;" width="329.1074" x="1042.45" y="147.5969"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="145.3457" x="1052.45" y="170.592">DynamicDawg(Char)</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="309.1074" x="1052.45" y="186.8889">Arc&lt;RwLock&lt;DawgCore&gt;&gt; &#183; SIMD + bloom</text></g><!--entity sa--><g class="entity" data-qualified-name="glock.sa" data-source-line="41" id="ent0011"><rect fill="#E8F5E9" height="52.5938" rx="7" ry="7" style="stroke:#455A64;stroke-width:0.5;" width="235.8926" x="1406.05" y="147.5969"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="161.3486" x="1416.05" y="170.592">SuffixAutomaton(Char)</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="215.8926" x="1416.05" y="186.8889">Arc&lt;RwLock&lt;&#8230;&gt;&gt; &#183; substring</text></g><!--entity sc--><g class="entity" data-qualified-name="glock.sc" data-source-line="42" id="ent0012"><rect fill="#E8F5E9" height="52.5938" rx="7" ry="7" style="stroke:#455A64;stroke-width:0.5;" width="257.5557" x="1677.22" y="147.5969"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="98.2939" x="1687.22" y="170.592">Scdawg(Char)</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="237.5557" x="1687.22" y="186.8889">Arc&lt;RwLock&lt;&#8230;&gt;&gt; &#183; bidirectional</text></g><!--entity pmd--><g class="entity" data-qualified-name="glock.pmd" data-source-line="43" id="ent0013"><rect fill="#E8F5E9" height="52.5938" rx="7" ry="7" style="stroke:#455A64;stroke-width:0.5;" width="337.2559" x="1042.37" y="276.7269"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="176.6406" x="1052.37" y="299.722">PathMapDictionary(Char)</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="317.2559" x="1052.37" y="316.0189">brief RwLock &#8594; snapshot, then lock-free walk</text></g><!--entity bij--><g class="entity" data-qualified-name="glock.bij" data-source-line="44" id="ent0014"><rect fill="#E8F5E9" height="52.5938" rx="7" ry="7" style="stroke:#455A64;stroke-width:0.5;" width="366.0146" x="1414.99" y="276.7269"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="89.5166" x="1424.99" y="299.722">BijectiveMap</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="346.0146" x="1424.99" y="316.0189">two RwLocks: forward DAWG + reverse HashMap</text></g><!--entity banner--><g class="entity" data-qualified-name="banner" data-source-line="28" id="ent0001"><rect fill="#CFD8DC" height="36.2969" rx="7" ry="7" style="stroke:#455A64;stroke-width:0.5;" width="348.2002" x="1295.9" y="44.2969"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="328.2002" x="1305.9" y="67.292">All dictionaries: Send + Sync &#183; Arc cheap-clone</text></g><g class="entity" data-qualified-name="GMN15" data-source-line="48" id="ent0016"><path d="M2002.1,260.1869 L2002.1,345.8509 L2485.8949,345.8509 L2485.8949,270.1869 L2475.8949,260.1869 L2002.1,260.1869" fill="#FFF3E0" style="stroke:#EF6C00;stroke-width:0.5;"/><path d="M2475.8949,260.1869 L2475.8949,270.1869 L2485.8949,270.1869 L2475.8949,260.1869" fill="#FFF3E0" style="stroke:#EF6C00;stroke-width:1;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="462.7949" x="2008.1" y="277.2538">Intended direction: the in-memory RwLock-guarded dynamic backends</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="442.2603" x="2008.1" y="292.3866">(DynamicDawg &#183; SuffixAutomaton &#183; Scdawg) are slated to adopt the</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="459.5894" x="2008.1" y="307.5194">lock-free reader model already shipping on DynamicDawgU64 and the</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="417.6377" x="2008.1" y="322.6522">Persistent* family. PathMapDictionary only locks to grab an &#119978;(1)</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="227.3667" x="2008.1" y="337.785">snapshot, then traverses lock-free.</text></g><!--link glock to GMN15--><g class="link" data-entity-1="ent0009" data-entity-2="ent0016" data-link-type="association" data-source-line="48" id="lnk17"><path d="M1978.0355,178.621 C1978.989,179.0634 1980.0205,179.5419 1981.1263,180.055 C1983.3379,181.081 1985.8468,182.245 1988.6233,183.5331 C1999.7291,188.6856 2015.1156,195.8244 2032.8813,204.0669 C2068.4125,220.5519 2113.46,241.4519 2152.81,259.7069" fill="none" id="glock-GMN15" style="stroke:#37474F;stroke-width:2;stroke-dasharray:7,7;"/></g><!--link banner to gfree--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="55" id="lnk18"><path d="M1295.69,65.9269 C1181.67,68.8169 1049.59,75.0769 1026,88.5969 C1006.795,99.6069 992.93,120.1994 983.8,138.2744 C982.6588,140.5338 981.5915,142.7538 980.597,144.9109 C980.0998,145.9894 979.6208,147.0522 979.1598,148.0963 C978.9293,148.6183 978.7033,149.1357 978.4818,149.648 C978.3711,149.9042 980.2282,145.5621 980.1197,145.8157" fill="none" id="banner-to-gfree" style="stroke:#455A64;stroke-width:3;"/><polygon fill="#455A64" points="978.153,150.4127,985.3706,143.7115,980.1197,145.8157,978.0155,140.5648,978.153,150.4127" style="stroke:#455A64;stroke-width:3;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link banner to glock--><g class="link" data-entity-1="ent0001" data-entity-2="ent0009" data-link-type="dependency" data-source-line="56" id="lnk19"><path d="M1644.27,67.6569 C1777.02,71.6369 1939.05,78.5169 1951,88.5969 C1954.6125,91.6431 1957.6236,95.2159 1960.1266,99.1396 C1960.7524,100.1205 1961.3464,101.1234 1961.91,102.1454 C1962.1919,102.6564 1962.4662,103.1722 1962.7331,103.6925 C1962.8665,103.9526 1960.781,99.7323 1960.9108,99.9946" fill="none" id="banner-to-glock" style="stroke:#455A64;stroke-width:3;"/><polygon fill="#455A64" points="1963.1279,104.4762,1962.7224,94.6357,1960.9108,99.9946,1955.5519,98.183,1963.1279,104.4762" style="stroke:#455A64;stroke-width:3;strok