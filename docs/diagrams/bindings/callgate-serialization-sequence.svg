Length="234.3301" x="137.9443" y="494.6841">node_edges(...) &#171;no gate; overlap is</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="168.9937" x="137.9443" y="509.8169">Q's advertised capability&#187;</text></g><g class="message" data-entity-1="part5" data-entity-2="part1" data-source-line="59" id="msg11"><polygon fill="#37474F" points="54.6436,540.0156,44.6436,544.0156,54.6436,548.0156,50.6436,544.0156" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#37474F;stroke-width:2;stroke-dasharray:2,2;" x1="48.6436" x2="868.207" y1="544.0156" y2="544.0156"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="17.7607" x="60.6436" y="538.9497">Ok</text></g><g class="message" data-entity-1="part5" data-entity-2="part2" data-source-line="60" id="msg12"><polygon fill="#37474F" points="141.9443,569.1484,131.9443,573.1484,141.9443,577.1484,137.9443,573.1484" style="stroke:#37474F;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#37474F;stroke-width:2;stroke-dasharray:2,2;" x1="135.9443" x2="873.207" y1="573.1484" y2="573.1484"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="17.7607" x="147.9443" y="568.0825">Ok</text></g><path d="M252,586.1484 L252,656.1484 L968,656.1484 L968,596.1484 L958,586.1484 L252,586.1484" fill="#FFFDE7" style="stroke:#F9A825;stroke-width:0.5;"/><path d="M958,586.1484 L958,596.1484 L968,596.1484 L958,586.1484" fill="#FFFDE7" style="stroke:#F9A825;stroke-width:0.5;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="464.1724" x="371.7878" y="603.2153">VT-GATE-1: the serialization domain is ONE captured provider object &#8212;</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="463.2646" x="371.7878" y="618.3481">the gate never serializes the library, other providers, or other captured</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="429.0698" x="371.7878" y="633.481">instances of the same resource. A poisoned lock is recovered, not</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="468.3999" x="371.7878" y="648.6138">propagated, so one contained provider fault cannot wedge later callers.</text></g></svg>