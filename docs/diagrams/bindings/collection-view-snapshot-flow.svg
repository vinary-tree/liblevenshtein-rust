<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="793px" preserveAspectRatio="none" style="width:648px;height:793px;" version="1.1" viewBox="0 0 648 793" width="648px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><g class="title" data-source-line="8"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="407.0764" x="117.211" y="24.9659">Collection traversal: one revision, two ownership products</text></g><!--entity live--><g class="entity" data-qualified-name="live" data-source-line="10" id="ent0001"><rect fill="#D9EAD3" height="58.1358" rx="2.5" ry="2.5" style="stroke:#415A77;stroke-width:0.5;" width="199.4653" x="203.76" y="47.0679"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="127.8615" x="213.76" y="72.0339">Live Rust dictionary</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="179.4653" x="213.76" y="91.1018">(any applicable automaton)</text></g><!--entity snap--><g class="entity" data-qualified-name="snap" data-source-line="11" id="ent0002"><rect fill="#D9EAD3" height="58.1358" rx="2.5" ry="2.5" style="stroke:#415A77;stroke-width:0.5;" width="164.1155" x="221.44" y="184.1979"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="102.4516" x="231.44" y="209.1639">O(1) immutable</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="144.1155" x="231.44" y="228.2318">snapshot root / graph</text></g><!--entity walk--><g class="entity" data-qualified-name="walk" data-source-line="12" id="ent0003"><rect fill="#B6D7A8" height="58.1358" rx="2.5" ry="2.5" style="stroke:#415A77;stroke-width:0.5;" width="168.0074" x="69.49" y="321.3379"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="148.0074" x="79.49" y="346.3039">Generic monomorphic</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="95.8156" x="79.49" y="365.3718">entry traversal</text></g><!--entity rust--><g class="entity" data-qualified-name="rust" data-source-line="13" id="ent0004"><rect fill="#93C47D" height="58.1358" rx="2.5" ry="2.5" style="stroke:#415A77;stroke-width:0.5;" width="156.9895" x="7" y="458.4779"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="63.5598" x="17" y="483.4439">Pure Rust</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="136.9895" x="17" y="502.5118">Iterator + fold/visitor</text></g><!--entity abi--><g class="entity" data-qualified-name="abi" data-source-line="14" id="ent0005"><rect fill="#FCE5CD" height="58.1358" rx="2.5" ry="2.5" style="stroke:#415A77;stroke-width:0.5;" width="169.6454" x="198.67" y="458.4779"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="140.2655" x="208.67" y="483.4439">Optional batched ABI</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="149.6454" x="208.67" y="502.5118">vt.dictionary.entries.v1</text></g><!--entity materialized--><g class="entity" data-qualified-name="materialized" data-source-line="15" id="ent0006"><rect fill="#CFE2F3" height="58.1358" rx="2.5" ry="2.5" style="stroke:#415A77;stroke-width:0.5;" width="179.4874" x="90.75" y="613.6079"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="154.8534" x="100.75" y="638.5739">Host-owned immutable</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="159.4874" x="100.75" y="657.6418">Set / Map / Iterable view</text></g><!--entity stream--><g class="entity" data-qualified-name="stream" data-source-line="16" id="ent0007"><rect fill="#9FC5E8" height="58.1358" rx="2.5" ry="2.5" style="stroke:#415A77;stroke-width:0.5;" width="154.3995" x="366.3" y="613.6079"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="134.3995" x="376.3" y="638.5739">Closeable streaming</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="105.9376" x="376.3" y="657.6418">cursor / reducer</text></g><g class="entity" data-qualified-name="GMN14" data-source-line="26" id="ent0015"><path d="M272.94,327.6979 L272.94,373.1099 A0,0 0 0 0 272.94,373.1099 L632.0573,373.1099 A0,0 0 0 0 632.0573,373.1099 L632.0573,337.6979 L622.0573,327.6979 L432.18,327.6979 L334.73,242.5979 L424.18,327.6979 L272.94,327.6979 A0,0 0 0 0 272.94,327.6979" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M622.0573,327.6979 L622.0573,337.6979 L632.0573,337.6979 L622.0573,327.6979" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="297.6223" x="278.94" y="346.5949">Concurrent mutation publishes another revision.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="338.1173" x="278.94" y="364.3009">Existing iterators remain stable and hold no writer lock.</text></g><g class="entity" data-qualified-name="GMN17" data-source-line="31" id="ent0018"><path d="M18.39,732.7479 L18.39,778.1599 A0,0 0 0 0 18.39,778.1599 L280.5922,778.1599 A0,0 0 0 0 280.5922,778.1599 L280.5922,742.7479 L270.5922,732.7479 L159.69,732.7479 L172.51,672.2079 L151.69,732.7479 L18.39,732.7479 A0,0 0 0 0 18.39,732.7479" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M270.5922,732.7479 L270.5922,742.7479 L280.5922,742.7479 L270.5922,732.7479" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="217.9062" x="24.39" y="751.6449">Ordinary early loop exit is leak-safe:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="241.2022" x="24.39" y="769.3509">the native snapshot is already released.</text></g><g class="entity" data-qualified-name="GMN20" data-source-line="36" id="ent0021"><path d="M315.5,732.7479 L315.5,778.1599 A0,0 0 0 0 315.5,778.1599 L633.4983,778.1599 A0,0 0 0 0 633.4983,778.1599 L633.4983,742.7479 L623.4983,732.7479 L472.3,732.7479 L451.48,672.2079 L464.3,732.7479 L315.5,732.7479 A0,0 0 0 0 315.5,732.7479" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M623.4983,732.7479 L623.4983,742.7479 L633.4983,742.7479 L623.4983,732.7479" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="296.9983" x="321.5" y="751.6449">Large dictionaries avoid O(output) host memory;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="276.2632" x="321.5" y="769.3509">try-with-resources / using / context manager.</text></g><!--link live to snap--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="18" id="lnk8"><path d="M303.49,105.4679 C303.49,128.5279 303.49,155.9279 303.49,178.9779" fill="none" id="live-to-snap" style="stroke:#415A77;stroke-width:1;"/><polygon fill="#415A77" points="303.49,183.9779,307.49,174.9779,303.49,178.9779,299.49,174.9779,303.49,183.9779" style="stroke:#415A77;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="79.8071" x="304.49" y="150.0949">capture once</text></g><!--link snap to walk--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="19" id="lnk9"><path d="M272.05,242.5979 C246.54,265.5879 214.4452,294.5017 188.8752,317