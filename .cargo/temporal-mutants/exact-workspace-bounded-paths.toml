examine_globs = ["src/time_series/elastic/walker.rs"]
examine_re = [
  "replace RangeContinuation<'a, K, V, D>::take_finished_results .* with Ok\\(vec!\\[\\]\\)",
  "replace ErpAutomatonRangeContinuation<'a, V, D>::take_finished_results .* with Ok\\(vec!\\[\\]\\)",
  "replace ElasticTransducer<K, V, D>::try_finish_bounded_range_results .* with Ok\\(vec!\\[\\]\\)",
  "replace != with == in ElasticTransducer<K, V, D>::try_finish_bounded_range_results",
  "replace ElasticTransducer<K, V, D>::try_finish_bounded_knn_results .* with Ok\\(vec!\\[\\]\\)",
]
additional_cargo_args = [
  "--locked",
  "--offline",
  "--test=proptest_query_plan_workspace",
]
test_package = ["liblevenshtein"]
copy_target = false
copy_vcs = false
gitignore = true
minimum_test_timeout = 60.0
timeout_multiplier = 3.0
