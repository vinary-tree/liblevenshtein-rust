# DragonFly's official mirror guide recommends AUTO for package consumers:
# https://www.dragonflybsd.org/mirrors/
# The CI VM is ephemeral; choose one repository explicitly so a default Avalon
# outage cannot stop the native C/C++ ABI portability check before compilation.
AUTO: {
    url: https://pkg.dragonflybsd.org/pkg/${ABI}/LATEST
    mirror_type: HTTP
    enabled: yes
}

Avalon: {
    enabled: no
}
