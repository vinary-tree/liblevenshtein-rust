---
name: Publish versioned package documentation

"on":
  workflow_call:
    inputs:
      archive_only:
        description: Build the release archive without deploying Pages.
        type: boolean
        required: false
        default: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The Julia development guide also writes gh-pages. Serialize both writers.
  group: liblevenshtein-pages-publish
  cancel-in-progress: false

jobs:
  build:
    name: Build immutable API references
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Require the authoritative immutable source tag
        shell: bash
        run: |
          set -euo pipefail
          source_tag="$(
            python3 -c \
              'import json;'\
              'd=json.load(open("release/version.json"));'\
              'print(d["publication"]["sourceTag"])'
          )"
          if [ "$GITHUB_REF" != "refs/tags/$source_tag" ]; then
            echo "::error::Dispatch against $source_tag, not $GITHUB_REF." >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@1.95
      - uses: ./.github/actions/checkout-dev-siblings
        with:
          source-ref-manifest: release/version.json
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.7"
      # setup-julia v3.0.2
      - uses: >-
          julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32
        with:
          version: "1.12.7"
      # setup-raku v1
      - uses: >-
          Raku/setup-raku@b8b1a4ebe85ef112edfc65e9edc8c57735367e3f
      # setup-uv v7.6.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          enable-cache: false
      # doxygen-install v2
      - uses: >-
          ssciwr/doxygen-install@fa3e94d34131d3990b6b8ba939ab982964aa3758
        with:
          version: "1.18.0"
      - name: Install locked documentation generators
        shell: bash
        run: |
          set -euo pipefail
          uv sync \
            --project bindings/python \
            --python 3.14.7 \
            --group documentation \
            --frozen \
            --no-install-project
          npm ci --prefix bindings/javascript --ignore-scripts
          echo "$GITHUB_WORKSPACE/bindings/python/.venv/bin" >> "$GITHUB_PATH"
      - name: Build the exact native library
        run: cargo build --locked --features native-bindings-full
      - name: Verify documentation model and archive contracts
        run: |
          python3 scripts/check-package-documentation.py
          python3 -m unittest discover \
            -s scripts/tests \
            -p 'test_*package_documentation*.py'
      - name: Build and verify all generated references
        env:
          LIBLEVENSHTEIN_LIBRARY: >-
            ${{ github.workspace }}/target/debug/libliblevenshtein.so
        run: >-
          python3 scripts/build-package-documentation.py
          --surface all
          --verify-reproducible
      - name: Create the deterministic version archive
        run: python3 scripts/package-documentation-site.py build
      - uses: actions/upload-artifact@v7
        with:
          name: package-documentation-release
          path: target/package-documentation-artifacts/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Verify release archive and deploy Pages
    needs: build
    if: ${{ !inputs.archive_only }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    environment:
      # The protected release environment accepts only reviewed v* tags.
      name: github-release
      url: https://vinary-tree.github.io/liblevenshtein-rust/
    steps:
      - uses: actions/checkout@v6
        with:
          # This job writes only the reviewed documentation tree to gh-pages.
          persist-credentials: true
      - uses: actions/download-artifact@v7
        with:
          name: package-documentation-release
          path: target/package-documentation-artifacts
      - name: Verify the published immutable documentation archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(
            python3 -c \
              'import json;'\
              'd=json.load(open("release/version.json"));'\
              'print(d["canonical"])'
          )"
          archive="target/package-documentation-artifacts/"
          archive+="liblevenshtein-package-documentation-$version.tar.gz"
          test -f "$archive"
          asset="$(basename "$archive")"
          release="$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME")"
          jq -e --arg tag "$GITHUB_REF_NAME" \
            '.tag_name == $tag and .draft == false and .immutable == true' \
            <<< "$release" >/dev/null
          asset_count="$(jq -r --arg name "$asset" '
            [.assets[] | select(.name == $name and .state == "uploaded")]
            | length
          ' <<< "$release")"
          test "$asset_count" = 1
          mkdir -p target/existing-package-documentation
          gh release download "$GITHUB_REF_NAME" \
            --pattern "$asset" \
            --dir target/existing-package-documentation
          existing="target/existing-package-documentation/$asset"
          cmp --silent "$archive" "$existing" || {
            echo '::error::Published documentation bytes differ from' \
              'the reproducible archive.' >&2
            exit 1
          }
      - name: Download every immutable version archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/all-package-documentation-archives
          asset_query='.[] | .assets[] | '
          asset_query+='select(.name | test("^liblevenshtein-package-'
          asset_query+='documentation-[0-9]+\\.[0-9]+\\.[0-9]+'
          asset_query+='(?:-[0-9A-Za-z.-]+)?\\.tar\\.gz$")) | '
          asset_query+='[.id, .name] | @tsv'
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq "$asset_query" \
            > target/package-documentation-assets.tsv
          test -s target/package-documentation-assets.tsv
          while IFS=$'\t' read -r asset_id asset_name; do
            destination="target/all-package-documentation-archives/$asset_name"
            if [ -e "$destination" ]; then
              echo "::error::Duplicate asset name: $asset_name" >&2
              exit 1
            fi
            gh api \
              -H 'Accept: application/octet-stream' \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              > "$destination"
          done < target/package-documentation-assets.tsv
      - name: Assemble every version without overwriting history
        run: >-
          python3 scripts/package-documentation-site.py assemble
          --archives target/all-package-documentation-archives
      - name: Merge the immutable versions into the live gh-pages tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin gh-pages
          branch="$PWD/target/package-docs-gh-pages"
          git worktree add --detach "$branch" FETCH_HEAD
          test -f "$branch/julia/dev/index.html"
          cp -a target/package-documentation-site/. "$branch/"
          test -f "$branch/julia/dev/index.html"
          git -C "$branch" add --all
          if git -C "$branch" diff --cached --quiet; then
            echo 'The immutable documentation site is already current.'
          else
            version="$(jq -r '.canonical' release/version.json)"
            bot_email='41898282+github-actions[bot]@users.noreply.github.com'
            git -C "$branch" \
              -c user.name='github-actions[bot]' \
              -c user.email="$bot_email" \
              commit -m "docs: publish immutable references for $version"
            git -C "$branch" push origin HEAD:refs/heads/gh-pages
          fi
      - name: Read back the public versioned API and preserved Julia guide
        shell: bash
        run: |
          set -euo pipefail
          branch="$PWD/target/package-docs-gh-pages"
          scratch="$PWD/target/package-docs-public-readback"
          mkdir -p "$scratch"
          python3 -c '
          import json
          from scripts.package_documentation_surfaces import (
              GENERATED_SURFACE_LAYOUT,
          )
          with open("release/version.json", encoding="utf-8") as stream:
              version = json.load(stream)["canonical"]
          print("index.html")
          print("versions.json")
          print("julia/dev/index.html")
          print(f"{version}/index.html")
          print(f"{version}/documentation-manifest.json")
          manifest_path = (
              f"target/package-documentation-site/{version}/"
              "documentation-manifest.json"
          )
          with open(manifest_path, encoding="utf-8") as stream:
              files = json.load(stream)["sha256"]
          for surface, (_, entry) in GENERATED_SURFACE_LAYOUT.items():
              print(f"{version}/{surface}/{entry}")
              for suffix in (".css", ".js"):
                  assets = sorted(
                      path for path in files
                      if path.startswith(f"{surface}/")
                      and path.endswith(suffix)
                  )
                  if assets:
                      print(f"{version}/{assets[0]}")
          ' > "$scratch/paths.txt"
          mapfile -t paths < "$scratch/paths.txt"
          test "${#paths[@]}" -ge 6
          site='https://vinary-tree.github.io/liblevenshtein-rust'
          for attempt in $(seq 1 36); do
            ready=1
            for path in "${paths[@]}"; do
              if ! curl --fail --silent --location "$site/$path" \
                --output "$scratch/public" || \
                ! cmp --silent "$branch/$path" "$scratch/public"; then
                ready=0
                break
              fi
            done
            if [ "$ready" -eq 1 ]; then
              echo "Verified ${#paths[@]} public documentation files."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Public Pages readback differs at $path." >&2
          exit 1
