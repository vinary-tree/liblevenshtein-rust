name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        feature-set: [default, all]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-dev-siblings
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - if: matrix.feature-set == 'default'
        run: cargo test --locked
      - if: matrix.feature-set == 'all'
        run: cargo test --locked --all-features
      - if: matrix.feature-set == 'all'
        run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - if: matrix.feature-set == 'all'
        run: cargo test --locked --manifest-path liblevenshtein-macros/Cargo.toml --all-features
      - if: matrix.feature-set == 'all'
        run: cargo build --locked --examples --all-features
      # The standalone interop repository owns its layout, discriminant, and
      # negotiation pins. Cross-repository CI replays them at the same ref.
      - run: cargo test --locked --manifest-path ../vinary-tree-interop/Cargo.toml
      - run: cargo fmt --all --check

  sanitizers:
    name: Sanitizers (ASan/TSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-dev-siblings
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      # AddressSanitizer (+ LeakSanitizer) then ThreadSanitizer over the
      # binding-integration suite: catches use-after-free, OOB, leaked
      # leased/retained resources, and races at the FFI boundary that safe Rust
      # and catch_unwind cannot. Rebuilds std with the sanitizer runtime.
      - name: AddressSanitizer and ThreadSanitizer over the binding suite
        run: bash scripts/run-sanitizers.sh

  miri:
    name: Miri (interop + consumer ABI)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      # The consumer-ABI correspondence tests below build against the
      # libdictenstein path dependency, so its source must be present even though
      # Miri never executes its (SIMD) dictionary backend on these paths.
      - uses: ./.github/actions/checkout-dev-siblings
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      # The interop crate is the base of the family ABI (no sibling deps); Miri
      # checks its layout (offset_of), vtable negotiation, and discriminant
      # reads for undefined behavior under the stacked-borrows model.
      - name: Miri over the interop layout and vtable unsafe
        run: cargo +nightly miri test --manifest-path ../vinary-tree-interop/Cargo.toml
      # Strict-provenance validation of the consumer's raw-pointer surface that
      # AddressSanitizer cannot see: VtResource / Box::into_raw+from_raw
      # round-trips, the two-pass arena pointer fixup, discriminant reads, the
      # lease/generation protocol, and (in abi_callgate) a multi-threaded gate
      # race that Miri schedules for interleaving UB. Every binding test driven by
      # the in-repo Rust providers is run here -- all verified Miri-clean (0 UB).
      # Isolation is disabled only for proptest's failure-persistence file; cases
      # are reduced because Miri interprets. This is a heavy leg (abi_callgate's
      # threaded interleaving dominates at minutes, not seconds).
      #
      # The four binding tests that build libdictenstein's real dictionary
      # backends are deliberately excluded: Miri has no native SIMD, so the
      # DynamicDawg/DoubleArrayTrie backend runs there only via a slow scalar
      # fallback (if at all), and the persistent-handoff tests additionally mmap,
      # which Miri does not support. They are covered by ASan (verified clean,
      # including ffi_arena_stability) and the native suite instead of Miri.
      # Excluded: ffi_arena_stability, query_start_snapshot_semantics,
      # libdictenstein_persistent_handoff, libdictenstein_resource_handoff.
      - name: Miri over the consumer resource-ABI correspondence
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
          PROPTEST_CASES: "8"
        run: >-
          cargo +nightly miri test --features binding-integration-tests
          --test abi_resource_lifecycle_correspondence
          --test ffi_batch_lease_correspondence
          --test abi_callgate_correspondence
          --test abi_layout_correspondence
          --test abi_paging_correspondence
          --test binding_snapshot_semantics
          --test ffi_boundary_census
          --test ffi_provider_fault_injection
          --test ffi_reducer_laws
          --test ffi_resource_snapshot_semantics
          --test query_comprehensive_test

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-dev-siblings
      # A Docker action cannot see sibling path dependencies outside the
      # repository mount. Run cargo-deny in the runner's complete source graph.
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check advisories bans sources licenses

  wasm:
    name: WASM build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-dev-siblings
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo check --locked --target wasm32-unknown-unknown --features wasm

  binding-contract:
    name: Tier 1 binding contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-dev-siblings
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # The JVM facade's default Gradle toolchain is Java 22. Installing a
          # newer JDK does not satisfy an exact Gradle toolchain request unless
          # a download repository is configured, so exercise the declared
          # baseline directly here; the dedicated current-JDK lane covers 26.
          java-version: "22"
      - run: python3 scripts/check-bindings.py
      - run: python3 scripts/check-binding-docs.py
      - run: python3 scripts/check-release-train.py
      - run: cargo build --locked --features native-bindings-full
      - run: cargo build --manifest-path ../libdictenstein/Cargo.toml --features ffi
      - name: C17/C23 and C++23 headers
        run: |
          cc -std=c17 -Wall -Wextra -Werror -Iinclude -I../vinary-tree-interop/include -x c -fsyntax-only include/liblevenshtein.h
          cc -std=c2x -Wall -Wextra -Werror -Iinclude -I../vinary-tree-interop/include -x c -fsyntax-only include/liblevenshtein.h
          c++ -std=c++23 -Wall -Wextra -Werror -Iinclude -I../vinary-tree-interop/include -x c++ -fsyntax-only include/liblevenshtein.hpp
      - name: C++ custom-provider cursor integration
        run: |
          c++ -std=c++20 -Wall -Wextra -Werror \
            -Iinclude -I../vinary-tree-interop/include \
            bindings/cpp/tests/snapshot.cpp -Ltarget/debug \
            -Wl,-rpath,"$PWD/target/debug" -lliblevenshtein \
            -o target/cpp-binding-smoke
          target/cpp-binding-smoke
      - name: Modular C and C++ cross-project snapshots
        run: |
          cc -std=c17 -Wall -Wextra -Werror \
            -Iinclude -I../libdictenstein/include -I../vinary-tree-interop/include \
            bindings/c/tests/cross_project_snapshot.c \
            -Ltarget/debug -lliblevenshtein \
            -L../libdictenstein/target/debug -llibdictenstein \
            -Wl,-rpath,"$PWD/target/debug" \
            -Wl,-rpath,"$PWD/../libdictenstein/target/debug" \
            -o target/c-cross-project-snapshot
          target/c-cross-project-snapshot
          cc -std=c17 -Wall -Wextra -Werror \
            -Iinclude -I../libdictenstein/include -I../vinary-tree-interop/include \
            bindings/c/tests/property.c \
            -Ltarget/debug -lliblevenshtein \
            -L../libdictenstein/target/debug -llibdictenstein \
            -Wl,-rpath,"$PWD/target/debug" \
            -Wl,-rpath,"$PWD/../libdictenstein/target/debug" \
            -o target/c-property
          target/c-property
          cc -std=c17 -Wall -Wextra -Werror -fsanitize=address -g \
            -Iinclude -I../libdictenstein/include -I../vinary-tree-interop/include \
            bindings/c/tests/leak.c \
            -Ltarget/debug -lliblevenshtein \
            -L../libdictenstein/target/debug -llibdictenstein \
            -Wl,-rpath,"$PWD/target/debug" \
            -Wl,-rpath,"$PWD/../libdictenstein/target/debug" \
            -o target/c-leak
          LD_PRELOAD="$(cc -print-file-name=libasan.so)" ASAN_OPTIONS=detect_leaks=1 target/c-leak
          cc -std=c17 -Wall -Wextra -Werror -fsanitize=address -g \
            -Iinclude -I../libdictenstein/include -I../vinary-tree-interop/include \
            bindings/c/tests/arena_profile.c \
            -Ltarget/debug -lliblevenshtein \
            -L../libdictenstein/target/debug -llibdictenstein \
            -Wl,-rpath,"$PWD/target/debug" \
            -Wl,-rpath,"$PWD/../libdictenstein/target/debug" \
            -o target/c-arena-profile
          LD_PRELOAD="$(cc -print-file-name=libasan.so)" ASAN_OPTIONS=detect_leaks=1 target/c-arena-profile
          c++ -std=c++23 -Wall -Wextra -Werror \
            -Iinclude -I../libdictenstein/include -I../vinary-tree-interop/include \
            ../libdictenstein/bindings/cpp/tests/cross_project_snapshot.cpp \
            -Ltarget/debug -lliblevenshtein \
            -L../libdictenstein/target/debug -llibdictenstein \
            -Wl,-rpath,"$PWD/target/debug" \
            -Wl,-rpath,"$PWD/../libdictenstein/target/debug" \
            -o target/cpp-cross-project-snapshot
          target/cpp-cross-project-snapshot
          c++ -std=c++23 -Wall -Wextra -Werror \
            -Iinclude -I../libdictenstein/include -I../vinary-tree-interop/include \
            bindings/cpp/tests/property.cpp \
            -Ltarget/debug -lliblevenshtein \
            -L../libdictenstein/target/debug -llibdictenstein \
            -Wl,-rpath,"$PWD/target/debug" \
            -Wl,-rpath,"$PWD/../libdictenstein/target/debug" \
            -o target/cpp-property
          target/cpp-property
          c++ -std=c++23 -Wall -Wextra -Werror -fsanitize=address -g \
            -Iinclude -I../libdictenstein/include -I../vinary-tree-interop/include \
            bindings/cpp/tests/leak.cpp \
            -Ltarget/debug -lliblevenshtein \
            -L../libdictenstein/target/debug -llibdictenstein \
            -Wl,-rpath,"$PWD/target/debug" \
            -Wl,-rpath,"$PWD/../libdictenstein/target/debug" \
            -o target/cpp-leak
          LD_PRELOAD="$(c++ -print-file-name=libasan.so)" ASAN_OPTIONS=detect_leaks=1 target/cpp-leak
      - name: Installed CMake package integration
        run: |
          pushd ../vinary-tree-interop
          scripts/stage-native-package.sh "$GITHUB_WORKSPACE/target/native-package"
          popd
          scripts/stage-native-package.sh \
            x86_64-unknown-linux-gnu target/debug target/native-package
          interop_prefix="$PWD/target/native-package/vinary-tree-interop-4.0.0-rc.4"
          liblevenshtein_prefix="$PWD/target/native-package/liblevenshtein-4.0.0-rc.4-x86_64-unknown-linux-gnu"
          cmake -S bindings/cpp/tests/package -B target/cmake-package-smoke \
            -DCMAKE_PREFIX_PATH="$interop_prefix;$liblevenshtein_prefix"
          cmake --build target/cmake-package-smoke
          LD_LIBRARY_PATH="$liblevenshtein_prefix/lib" \
            target/cmake-package-smoke/liblevenshtein_package_smoke
          cmake -S bindings/cpp/tests/package -B target/cmake-package-static-smoke \
            -DCMAKE_PREFIX_PATH="$interop_prefix;$liblevenshtein_prefix" \
            -DLIBLEVENSHTEIN_LINKAGE=STATIC
          cmake --build target/cmake-package-static-smoke
          target/cmake-package-static-smoke/liblevenshtein_package_smoke
          PKG_CONFIG_PATH="$interop_prefix/lib/pkgconfig:$liblevenshtein_prefix/lib/pkgconfig" \
            pkg-config --validate liblevenshtein
          pushd ../libdictenstein
          scripts/stage-native-package.sh \
            x86_64-unknown-linux-gnu target/debug \
            "$GITHUB_WORKSPACE/target/native-package"
          popd
          libdictenstein_prefix="$PWD/target/native-package/libdictenstein-4.0.0-rc.4-x86_64-unknown-linux-gnu"
          package_prefixes="$interop_prefix;$liblevenshtein_prefix;$libdictenstein_prefix"
          cmake -S bindings/cpp/tests/package-cross \
            -B target/cmake-cross-project-shared \
            -DCMAKE_PREFIX_PATH="$package_prefixes"
          cmake --build target/cmake-cross-project-shared
          LD_LIBRARY_PATH="$liblevenshtein_prefix/lib:$libdictenstein_prefix/lib" \
            target/cmake-cross-project-shared/vinary_tree_cross_project_package_smoke
          cmake -S bindings/cpp/tests/package-cross \
            -B target/cmake-cross-project-static \
            -DCMAKE_PREFIX_PATH="$package_prefixes" \
            -DLIBLEVENSHTEIN_LINKAGE=STATIC \
            -DLIBDICTENSTEIN_LINKAGE=STATIC
          cmake --build target/cmake-cross-project-static
          target/cmake-cross-project-static/vinary_tree_cross_project_package_smoke
          PKG_CONFIG_PATH="$interop_prefix/lib/pkgconfig:$libdictenstein_prefix/lib/pkgconfig" \
            pkg-config --validate libdictenstein
      - name: JVM FFM provider and phonetic smoke integration
        run: |
          mkdir -p target/jvm-smoke
          mapfile -d '' -t java_sources < <(
            find ../vinary-tree-interop/bindings/jvm/src/main/java \
              bindings/jvm/src/main/java bindings/jvm/src/smoke/java \
              -name '*.java' -print0
          )
          javac --release 22 -d target/jvm-smoke \
            "${java_sources[@]}"
          java --enable-native-access=ALL-UNNAMED \
            -Djava.library.path=target/debug -cp target/jvm-smoke \
            io.vinarytree.liblevenshtein.FfmSmoke
          java --enable-native-access=ALL-UNNAMED \
            -Djava.library.path=target/debug -cp target/jvm-smoke \
            io.vinarytree.liblevenshtein.ResourceSnapshotSmoke
      - name: JVM unit tests and strict Javadoc
        working-directory: bindings/jvm
        run: >-
          ./gradlew --no-daemon test propertyTest javadoc
          -Pliblevenshtein.nativeDir=../../target/debug
      - name: Libdictenstein JVM CRUD, persistence, and cross-project snapshots
        shell: bash
        run: |
          mkdir -p bindings/jvm/build/native-resources/META-INF/native/linux-x86_64
          cp target/debug/libliblevenshtein.so \
            bindings/jvm/build/native-resources/META-INF/native/linux-x86_64/
          ../libdictenstein/bindings/jvm/gradlew --no-daemon \
            -p ../libdictenstein/bindings/jvm \
            -PnativePlatforms=linux-x86_64 \
            -PjavaToolchain=25 \
            -PvinaryTree.nativeDir="$PWD/../libdictenstein/target/debug:$PWD/target/debug" \
            test javadoc

  python-bindings:
    name: Python ${{ matrix.python-version }} binding
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-dev-siblings
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --features python-bindings
      - run: cargo build --manifest-path ../libdictenstein/Cargo.toml --features ffi
      - run: python -m pip install pytest hypothesis typing-extensions
      - name: Custom-provider and long-lived snapshot tests
        env:
          LIBLEVENSHTEIN_LIBRARY: ${{ github.workspace }}/target/debug/libliblevenshtein.so
          PYTHONPATH: bindings/python/src:../vinary-tree-interop/bindings/python/src
        run: python -m pytest -q bindings/python/tests
      - name: Libdictenstein backends and cross-project snapshots
        env:
          LIBDICTENSTEIN_LIBRARY: ${{ github.workspace }}/../libdictenstein/target/debug/liblibdictenstein.so
          LIBLEVENSHTEIN_LIBRARY: ${{ github.workspace }}/target/debug/libliblevenshtein.so
          PYTHONPATH: >-
            ${{ github.workspace }}/../libdictenstein/bindings/python/src:${{ github.workspace }}/bindings/python/src:${{ github.workspace }}/../vinary-tree-interop/bindings/python/src
        run: python -m pytest -q ../libdictenstein/bindings/python/tests

  javascript-bindings:
    name: Node ${{ matrix.node-version }} facade
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-dev-siblings
      - uses: dtolnay/rust-toolchain@1.95
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      # The ClojureScript compiler is built for Java 21 bytecode. Runner-image
      # defaults are not part of our package contract, so pin its minimum LTS
      # runtime explicitly for every supported Node release.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      # The package contract includes compiling its ClojureScript namespace;
      # install the compiler explicitly instead of relying on runner state.
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
      - uses: Swatinem/rust-cache@v2
      - run: npm test --prefix ../vinary-tree-interop/bindings/javascript
      # `npm pack` executes prepack, whose ClojureScript integration suite
      # deliberately exercises the default native facade. Assemble the same
      # four-component static SDK and N-API addon that consumers receive for
      # each supported Node ABI instead of relying on local build residue.
      - name: Build the shared native runtime for ClojureScript integration
        working-directory: ../javascript-runtime
        run: |
          npm install --ignore-scripts --no-save \
            node-gyp@13.0.1 \
            ../vinary-tree-interop/bindings/javascript
          npm run configure:local
          npm run bootstrap:native
          npm run build:native
      - name: Validate native, WASM, WASI, TS, and CLJS facades
        working-directory: bindings/javascript
        run: |
          npm ci
          npm run build
          npm run test:contract
          npm pack --dry-run

  jvm-latest:
    name: JVM current JDK 26
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-dev-siblings
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "26"
          cache: gradle
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --features jvm-bindings
      - run: cargo build --manifest-path ../libdictenstein/Cargo.toml --features ffi
      - name: Java 22 API and bytecode on the current JDK
        working-directory: bindings/jvm
        run: >-
          ./gradlew --no-daemon test propertyTest javadoc
          -PjavaToolchain=26
          -Pliblevenshtein.nativeDir=../../target/debug

  clojure-bindings:
    name: Clojure ${{ matrix.clojure-version }} / JDK ${{ matrix.java-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - java-version: "25"
            clojure-version: "1.11.4"
          - java-version: "25"
            clojure-version: "1.12.5"
          - java-version: "26"
            clojure-version: "1.12.5"
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-dev-siblings
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: gradle
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --features clojure-bindings
      - run: cargo build --manifest-path ../libdictenstein/Cargo.toml --features ffi
      - name: Compile Java FFM and interop dependencies
        working-directory: bindings/jvm
        run: >-
          ./gradlew --no-daemon compileJava
          -PjavaToolchain=${{ matrix.java-version }}
      - name: Compile libdictenstein Java FFM facade
        working-directory: ../libdictenstein/bindings/jvm
        run: >-
          ./gradlew --no-daemon compileJava
          -PjavaToolchain=${{ matrix.java-version }}
      - name: Clojure facade and long-lived snapshot tests
        working-directory: bindings/clojure
        env:
          JAVA_TOOL_OPTIONS: >-
            --enable-native-access=ALL-UNNAMED
            -Djava.library.path=${{ github.workspace }}/target/debug
        run: >-
          clojure
          -Sdeps '{:deps {org.clojure/clojure {:mvn/version "${{ matrix.clojure-version }}"}}}'
          -M:test
      - name: Libdictenstein CRUD and cross-project Clojure snapshots
        working-directory: ../libdictenstein/bindings/clojure
        env:
          JAVA_TOOL_OPTIONS: >-
            --enable-native-access=ALL-UNNAMED
            -Djava.library.path=${{ github.workspace }}/../libdictenstein/target/debug:${{ github.workspace }}/target/debug
          LD_LIBRARY_PATH: >-
            ${{ github.workspace }}/../libdictenstein/target/debug:${{ github.workspace }}/target/debug
        run: >-
          clojure
          -Sdeps '{:deps {org.clojure/clojure {:mvn/version "${{ matrix.clojure-version }}"}}}'
          -M:test

  clojure-source-contract:
    name: Babashka Clojure source contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-dev-siblings
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          bb: latest
      - run: bb scripts/check-clojure-facades.clj

  javascript-runtime:
    name: Related native, browser WASM, and Node WASI runtime
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-dev-siblings
      # javascript-runtime pins 1.95.0 in rust-toolchain.toml. Install targets
      # for that exact active toolchain; installing them only for the runner's
      # newer default `stable` leaves the nested WASI build without libcore.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          targets: wasm32-unknown-unknown, wasm32-wasip1
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      # Ubuntu 24.04's Binaryen cannot parse the reference-types opcodes
      # emitted by the current Rust/WASM toolchain. Reuse the runtime's pinned,
      # checksummed installer so local CI and its release workflow optimize with
      # the same known-compatible wasm-opt.
      - run: bash ../javascript-runtime/.github/setup-binaryen.sh
      - name: Build the four statically linked native components
        shell: bash
        run: |
          cargo build --locked --features native-bindings-full
          cargo build --manifest-path ../libdictenstein/Cargo.toml --features ffi
          cargo build --manifest-path ../lling-llang/Cargo.toml --no-default-features --features ffi
          cargo build --manifest-path ../duallity/Cargo.toml --no-default-features --features ffi
      - name: Related C++ resource facades
        shell: bash
        run: |
          c++ -std=c++23 -Wall -Wextra -Werror \
            -I../lling-llang/include -I../vinary-tree-interop/include \
            ../lling-llang/bindings/cpp/tests/package_smoke.cpp \
            -L../lling-llang/target/debug -llling_llang \
            -Wl,-rpath,"$PWD/../lling-llang/target/debug" \
            -o target/lling-cpp-smoke
          target/lling-cpp-smoke
          c++ -std=c++23 -Wall -Wextra -Werror \
            -I../duallity/include -I../vinary-tree-interop/include \
            ../duallity/bindings/cpp/tests/package_smoke.cpp \
            -L../duallity/target/debug -lduallity \
            -Wl,-rpath,"$PWD/../duallity/target/debug" \
            -o target/duallity-cpp-smoke
          target/duallity-cpp-smoke
      - name: Native N-API cross-project conformance
        working-directory: ../javascript-runtime
        run: |
          npm install --ignore-scripts --no-save \
            node-gyp@13.0.1 \
            ../vinary-tree-interop/bindings/javascript
          npm run configure:local
          npm run bootstrap:native
          npm run build:native
          npm run test:native
          npm run test:leak
          npm run test:property
      - name: Browser WASM and Node WASI conformance
        working-directory: ../javascript-runtime
        run: |
          npm run build:wasm
          npm run build:wasi
          npm test
      - name: Project-owned JS, TS, and CLJS facade contracts
        run: |
          npm ci --prefix bindings/javascript
          npm test --prefix bindings/javascript
          npm test --prefix ../libdictenstein/bindings/javascript
          npm test --prefix ../lling-llang/bindings/javascript
          npm test --prefix ../duallity/bindings/javascript

  dotnet-bindings:
    name: .NET 8 LTS and .NET 10 current
    runs-on: ubuntu-24.04
    env:
      VinaryTreeInteropRoot: ${{ github.workspace }}/../vinary-tree-interop
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-dev-siblings
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: cargo build --locked --features dotnet-bindings
      - run: cargo build --manifest-path ../libdictenstein/Cargo.toml --features ffi
      - name: Run the streaming and snapshot suite on both target frameworks
        shell: bash
        env:
          # The C8 property suite builds dictionaries with the libdictenstein
          # sibling's DynamicDawg, so its native library must be resolvable too.
          LD_LIBRARY_PATH: ${{ github.workspace }}/../libdictenstein/target/debug:${{ github.workspace }}/target/debug
        run: |
          project=bindings/dotnet/tests/VinaryTree.Liblevenshtein.Tests/VinaryTree.Liblevenshtein.Tests.csproj
          dotnet restore "$project" -p:NuGetAudit=false -m:1
          dotnet build "$project" --framework net8.0 --no-restore -m:1
          dotnet run --project "$project" --framework net8.0 --no-build
          dotnet build "$project" --framework net10.0 --no-restore -m:1
          dotnet run --project "$project" --framework net10.0 --no-build
          dotnet pack --configuration Release -p:BuildInParallel=false \
            ../vinary-tree-interop/bindings/dotnet/src/VinaryTree.Interop
          dotnet pack --configuration Release -p:BuildInParallel=false \
            bindings/dotnet/src/VinaryTree.Liblevenshtein
      - name: Run libdictenstein CRUD and cross-project snapshots on both frameworks
        shell: bash
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/../libdictenstein/target/debug:${{ github.workspace }}/target/debug
        run: |
          project=../libdictenstein/bindings/dotnet/tests/VinaryTree.Libdictenstein.Tests/VinaryTree.Libdictenstein.Tests.csproj
          dotnet restore "$project" -p:NuGetAudit=false -m:1
          dotnet build "$project" --framework net8.0 --no-restore -m:1
          dotnet run --project "$project" --framework net8.0 --no-build
          dotnet build "$project" --framework net10.0 --no-restore -m:1
          dotnet run --project "$project" --framework net10.0 --no-build

  go-bindings:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.25.x", "1.26.x"]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-dev-siblings
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: false
      - run: cargo build --locked --features go-bindings
      - run: cargo build --manifest-path ../libdictenstein/Cargo.toml --features ffi
      - name: Streaming, retained-resource, and snapshot tests
        working-directory: bindings/go
        env:
          # The C8 property/leak suites build dictionaries with the libdictenstein
          # sibling's DynamicDawg (resolved via go.work), so its native library
          # must be linkable and loadable too.
          CGO_LDFLAGS: -L${{ github.workspace }}/../libdictenstein/target/debug -L${{ github.workspace }}/target/debug
          LD_LIBRARY_PATH: ${{ github.workspace }}/../libdictenstein/target/debug:${{ github.workspace }}/target/debug
        run: go test -race ./...
      - name: Libdictenstein CRUD and cross-project snapshots
        working-directory: ../libdictenstein/bindings/go
        env:
          CGO_LDFLAGS: >-
            -L${{ github.workspace }}/../libdictenstein/target/debug -L${{ github.workspace }}/target/debug
          LD_LIBRARY_PATH: >-
            ${{ github.workspace }}/../libdictenstein/target/debug:${{ github.workspace }}/target/debug
        run: go test -race ./...

  swift-bindings:
    name: Swift current on macOS ARM64
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-dev-siblings
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --features swift-bindings
      - run: cargo build --manifest-path ../libdictenstein/Cargo.toml --features ffi
      - name: SwiftPM cross-project snapshot integration
        env:
          VINARY_TREE_INTEROP_ROOT: ${{ github.workspace }}/../vinary-tree-interop/bindings/swift/vinary-tree-interop
          LIBRARY_PATH: ${{ github.workspace }}/target/debug:${{ github.workspace }}/../libdictenstein/target/debug
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/target/debug:${{ github.workspace }}/../libdictenstein/target/debug
        run: swift run --package-path bindings/swift/Integration -c release

  ruby-bindings:
    name: Ruby ${{ matrix.ruby-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ["3.3", "3.4", "3.5"]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-dev-siblings
      - uses: dtolnay/rust-toolchain@stable
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
      - run: cargo build --locked --features ruby-bindings
      - run: cargo build --manifest-path ../libdictenstein/Cargo.toml --features ffi
      - name: One-shot Enumerable and snapshot integration
        env:
          LIBLEVENSHTEIN_LIBRARY: ${{ github.workspace }}/target/debug/libliblevenshtein.so
          LIBDICTENSTEIN_LIBRARY: ${{ github.workspace }}/../libdictenstein/target/debug/liblibdictenstein.so
          RUBYLIB: ${{ github.workspace }}/bindings/ruby/lib:${{ github.workspace }}/../libdictenstein/bindings/ruby/lib
        run: |
          ruby bindings/ruby/test/test_liblevenshtein.rb
          ruby bindings/ruby/test/test_property.rb
          ruby bindings/ruby/test/test_leak.rb
          ruby ../libdictenstein/bindings/ruby/test/test_cross_project.rb
      - run: gem build bindings/ruby/liblevenshtein.gemspec

  fortran-bindings:
    name: Fortran 2018 / ${{ matrix.toolchain.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - compiler: gcc
            version: "15"
            setup: action
          # fpm 0.13 misclassifies AOCC's classic flang as LLVM flang and then
          # injects unsupported LLVM-only flags. Keep the supported modern
          # LLVM Flang lane below instead of reporting a false source failure.
          - compiler: llvm-flang
            version: "22"
            setup: apt
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-dev-siblings
      - uses: dtolnay/rust-toolchain@stable
      - uses: fortran-lang/setup-fortran@v1
        if: matrix.toolchain.setup == 'action'
        with:
          compiler: ${{ matrix.toolchain.compiler }}
          version: ${{ matrix.toolchain.version }}
      - name: Install LLVM Flang 22
        if: matrix.toolchain.setup == 'apt'
        shell: bash
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/apt.llvm.org.gpg
          echo "deb [signed-by=/usr/share/keyrings/apt.llvm.org.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-22.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y flang-22
          command -v flang-new-22
          echo "FPM_FC=flang-new-22" >> "$GITHUB_ENV"
      - uses: fortran-lang/setup-fpm@v10
      - run: cargo build --locked --features fortran-bindings
      - run: cargo build --manifest-path ../libdictenstein/Cargo.toml --features ffi
      - name: fpm standalone and cross-project snapshot suites
        shell: bash
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/debug:${{ github.workspace }}/../libdictenstein/target/debug
        run: |
          pushd bindings/fortran
          fpm test --profile release --compiler "$FPM_FC" \
            --link-flag "-L../../target/debug -Wl,-rpath,../../target/debug"
          popd
          pushd bindings/fortran/integration
          fpm test --profile release --compiler "$FPM_FC" \
            --link-flag "-L../../../target/debug -L../../../../libdictenstein/target/debug -Wl,-rpath,../../../target/debug -Wl,-rpath,../../../../libdictenstein/target/debug"
          popd

  ocaml-bindings:
    name: OCaml 5 ${{ matrix.ocaml-compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ocaml-compiler: ["5.2.1", "5.4.0"]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-dev-siblings
      - uses: dtolnay/rust-toolchain@stable
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
      - run: opam install dune.3.20.2 --yes
      - run: opam install qcheck-core --yes
      - run: cargo build --locked --features ocaml-bindings
      - run: cargo build --manifest-path ../libdictenstein/Cargo.toml --features ffi
      - name: Install modular OCaml dependencies and run snapshot suite
        shell: bash
        env:
          LIBRARY_PATH: ${{ github.workspace }}/target/debug:${{ github.workspace }}/../libdictenstein/target/debug
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/debug:${{ github.workspace }}/../libdictenstein/target/debug
        run: |
          opam exec -- dune build --root ../vinary-tree-interop/bindings/ocaml @install
          opam exec -- dune install --root ../vinary-tree-interop/bindings/ocaml
          opam exec -- dune build --root ../libdictenstein/bindings/ocaml @install
          opam exec -- dune install --root ../libdictenstein/bindings/ocaml
          opam exec -- dune build --root bindings/ocaml @install @runtest

  haskell-bindings:
    name: GHC ${{ matrix.ghc }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ghc: ["9.6.7", "9.14.1"]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-dev-siblings
      - uses: dtolnay/rust-toolchain@stable
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: latest
      - run: cargo build --locked --features haskell-bindings
      - run: cargo build --manifest-path ../libdictenstein/Cargo.toml --features ffi
      - name: Stage pkg-config metadata and test streaming snapshots
        shell: bash
        run: |
          mkdir -p target/haskell-native/lib/pkgconfig target/haskell-native/include
          cp target/debug/libliblevenshtein.so target/haskell-native/lib/
          cp ../libdictenstein/target/debug/liblibdictenstein.so target/haskell-native/lib/
          cp pkgconfig/liblevenshtein.pc target/haskell-native/lib/pkgconfig/
          cp ../libdictenstein/pkgconfig/libdictenstein.pc target/haskell-native/lib/pkgconfig/
          cp ../vinary-tree-interop/pkgconfig/vinary-tree-interop.pc \
            target/haskell-native/lib/pkgconfig/
          cp include/liblevenshtein.h include/liblevenshtein_abi.h \
            ../vinary-tree-interop/include/vinary_tree_interop.h \
            ../libdictenstein/include/libdictenstein.h target/haskell-native/include/
          pushd bindings/haskell
          PKG_CONFIG_PATH="$GITHUB_WORKSPACE/target/haskell-native/lib/pkgconfig" \
          LD_LIBRARY_PATH="$GITHUB_WORKSPACE/target/haskell-native/lib" \
            cabal test --project-file=cabal.project -fstrict all
          popd

  lua-bindings:
    name: Lua 5.4
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-dev-siblings
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y lua5.4 liblua5.4-dev
      - run: cargo build --locked --features lua-bindings
      - run: cargo build --manifest-path ../libdictenstein/Cargo.toml --features ffi
      - name: Build modular Lua rocks and run cross-project snapshots
        shell: bash
        run: |
          mkdir -p target/lua/vinary_tree
          read -r -a lua_cflags <<< "$(pkg-config --cflags lua5.4)"
          cc -std=c17 -Wall -Wextra -Werror -shared -fPIC \
            "${lua_cflags[@]}" \
            -I../libdictenstein/include -I../vinary-tree-interop/include \
            -I../libdictenstein/bindings/lua/include \
            -I../vinary-tree-interop/bindings/lua \
            ../libdictenstein/bindings/lua/src/libdictenstein_lua.c \
            -L../libdictenstein/target/debug -llibdictenstein \
            -o target/lua/vinary_tree/libdictenstein.so
          cc -std=c17 -Wall -Wextra -Werror -shared -fPIC \
            "${lua_cflags[@]}" \
            -Iinclude -I../vinary-tree-interop/include \
            -I../vinary-tree-interop/bindings/lua \
            bindings/lua/src/liblevenshtein_lua.c \
            -Ltarget/debug -lliblevenshtein \
            -o target/lua/vinary_tree/liblevenshtein.so
          LUA_CPATH="$PWD/target/lua/?.so;$PWD/target/lua/?/?.so;;" \
          LD_LIBRARY_PATH="$PWD/target/debug:$PWD/../libdictenstein/target/debug" \
            lua5.4 bindings/lua/tests/snapshot.lua
          LUA_CPATH="$PWD/target/lua/?.so;$PWD/target/lua/?/?.so;;" \
          LD_LIBRARY_PATH="$PWD/target/debug:$PWD/../libdictenstein/target/debug" \
            lua5.4 bindings/lua/tests/property.lua
          LUA_CPATH="$PWD/target/lua/?.so;$PWD/target/lua/?/?.so;;" \
          LD_LIBRARY_PATH="$PWD/target/debug:$PWD/../libdictenstein/target/debug" \
            lua5.4 bindings/lua/tests/leak.lua

  native-portability:
    name: ${{ matrix.platform.name }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: Linux aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macOS aarch64
            runner: macos-26
            target: aarch64-apple-darwin
          - name: Windows x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-dev-siblings
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Report architecture and CPU
        shell: bash
        run: |
          uname -a || true
          rustc -vV
      - run: >-
          cargo test --locked --target ${{ matrix.platform.target }}
          --features native-bindings-full
          --test query_start_snapshot_semantics
          --test binding_snapshot_semantics
          --test ffi_resource_snapshot_semantics
      - run: >-
          cargo test --locked --manifest-path ../vinary-tree-interop/Cargo.toml
          --target ${{ matrix.platform.target }}

  linux-armv7-experimental:
    name: Linux armv7 (experimental)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-portable-siblings
      - uses: houseabsolute/actions-rust-cross@v1
        with:
          command: test
          target: armv7-unknown-linux-gnueabihf
          args: "--locked --no-default-features --features native-bindings-full --test query_start_snapshot_semantics --test binding_snapshot_semantics --test ffi_resource_snapshot_semantics"
      # The 32-bit ARM EABI leg is the one place the exact_32_arm layout table
      # in ../vinary-tree-interop/tests/layout_contract.rs actually executes.
      - uses: houseabsolute/actions-rust-cross@v1
        with:
          command: test
          target: armv7-unknown-linux-gnueabihf
          args: "--locked --manifest-path vendor/vinary-tree-interop/Cargo.toml"

  bsd-portability:
    name: ${{ matrix.platform.name }}
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.platform.experimental }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: FreeBSD 15.1 x86_64
            os: freebsd
            version: "15.1"
            install: sudo pkg install -y rust
            native_rust_at_msrv: true
            experimental: false
          - name: NetBSD 10.1 x86_64
            os: netbsd
            version: "10.1"
            install: sudo pkgin -y install rust
            native_rust_at_msrv: true
            experimental: false
          - name: OpenBSD 7.9 x86_64
            os: openbsd
            version: "7.9"
            install: sudo pkg_add rust
            # OpenBSD 7.9 currently packages rustc 1.94.1, below this family's
            # declared Rust 1.95 MSRV. The VM still validates the native C ABI;
            # a required current-Rust OpenBSD compile is maintained below.
            native_rust_at_msrv: false
            experimental: false
          - name: DragonFly BSD 6.4.2 x86_64
            os: dragonflybsd
            version: "6.4.2"
            install: sudo pkg install -y rust
            native_rust_at_msrv: true
            experimental: true
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-portable-siblings
      - name: Start ${{ matrix.platform.name }} VM
        uses: cross-platform-actions/action@v1.3.0
        with:
          operating_system: ${{ matrix.platform.os }}
          architecture: x86-64
          version: ${{ matrix.platform.version }}
          shell: sh
          memory: 6G
          cpu_count: 2
      - name: Install Rust
        shell: cpa.sh {0}
        run: |
          attempt=1
          while [ "$attempt" -le 3 ]; do
            if ${{ matrix.platform.install }}; then
              exit 0
            fi
            echo "package installation attempt $attempt failed; retrying" >&2
            sleep "$((attempt * 5))"
            attempt="$((attempt + 1))"
          done
          exit 1
      - name: Compile the native binding surface
        if: matrix.platform.native_rust_at_msrv != false
        shell: cpa.sh {0}
        run: cargo check --locked --no-default-features --features native-bindings-full
      - name: Run long-lived snapshot integration tests
        if: matrix.platform.native_rust_at_msrv != false
        shell: cpa.sh {0}
        run: |
          cargo test --locked --no-default-features --features native-bindings-full \
            --test query_start_snapshot_semantics \
            --test binding_snapshot_semantics \
            --test ffi_resource_snapshot_semantics
      - name: Run interop ABI contract tests
        if: matrix.platform.native_rust_at_msrv != false
        shell: cpa.sh {0}
        run: cargo test --locked --manifest-path vendor/vinary-tree-interop/Cargo.toml
      - name: Validate the native C and C++ ABI headers below Rust MSRV
        if: matrix.platform.native_rust_at_msrv == false
        shell: cpa.sh {0}
        run: |
          cc -std=c17 -Wall -Wextra -Werror \
            -Iinclude -Ivendor/vinary-tree-interop/include \
            -x c -fsyntax-only include/liblevenshtein.h
          c++ -std=c++20 -Wall -Wextra -Werror \
            -Iinclude -Ivendor/vinary-tree-interop/include \
            -x c++ -fsyntax-only include/liblevenshtein.hpp

  bsd-aarch64-compile:
    name: ${{ matrix.name }} ${{ matrix.target }} compile
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: FreeBSD
            target: aarch64-unknown-freebsd
            experimental: false
          - name: NetBSD
            target: aarch64-unknown-netbsd
            experimental: true
          - name: OpenBSD
            target: aarch64-unknown-openbsd
            experimental: true
          - name: OpenBSD
            target: x86_64-unknown-openbsd
            experimental: false
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-portable-siblings
      # Tier-3 BSD targets do not receive prebuilt standard libraries. Build
      # std from the exact nightly source instead of silently dropping those
      # targets when a stable rustup component disappears.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: >-
          cargo +nightly check -Zbuild-std --locked --target ${{ matrix.target }}
          --no-default-features --features native-bindings-full

  msrv:
    name: Rust 1.95 MSRV
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-dev-siblings
      - uses: dtolnay/rust-toolchain@1.95
      - run: cargo check --locked --features ffi

  benchmarks:
    name: Benchmark compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-dev-siblings
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo build --locked --benches --all-features

  downstream-boundary:
    name: Library dependency boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-dev-siblings
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo tree --locked --all-features --edges normal
      - name: Reject application-only packages
        run: |
          if cargo tree --locked --all-features --edges normal |
             grep -E ' (clap|rustyline|quick-xml|pdf-extract|calamine|docx-rs|leptess|tar|zip|zstd|xz2|bzip2) v'; then
            echo "application-only dependency leaked into liblevenshtein" >&2
            exit 1
          fi

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/checkout-dev-siblings
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --all-features --no-deps
