project:
  name: vinary-tree-interop
  version: 0.1.0
  description: Shared retained-resource layouts for modular Vinary Tree JVM bindings
  authors:
    - Dylon Edwards
  license: Apache-2.0
  links:
    homepage: https://github.com/vinary-tree/liblevenshtein-rust/tree/main/vinary-tree-interop
  java:
    groupId: io.vinarytree
    artifactId: vinary-tree-interop

signing:
  pgp:
    active: RELEASE
    armored: true

deploy:
  maven:
    mavenCentral:
      sonatype:
        active: RELEASE
        url: https://central.sonatype.com/api/v1/publisher
        authorization: BASIC
        applyMavenCentralRules: true
        stagingRepositories:
          - build/staging-deploy
