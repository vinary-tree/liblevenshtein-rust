name: Formal Verification

on:
  push:
    branches: [ master, develop, dylon/* ]
    paths:
      - 'docs/verification/**'
      - 'rocq/**'
      - 'scripts/verify-formal.sh'
      - '.github/workflows/formal-verification.yml'
  pull_request:
    branches: [ master, develop ]
    paths:
      - 'docs/verification/**'
      - 'rocq/**'
      - 'scripts/verify-formal.sh'
      - '.github/workflows/formal-verification.yml'
  workflow_dispatch:
    inputs:
      run_full:
        description: 'Run capped Coq/TLC checks on a self-hosted Linux runner'
        required: true
        default: false
        type: boolean

concurrency:
  group: formal-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trusted-audit:
    name: Trusted Scope Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install audit tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Check trusted proof scope
        run: scripts/verify-formal.sh trusted

      - name: Report proof debt
        run: scripts/verify-formal.sh audit

  capped-full:
    name: Capped Coq and TLC
    if: github.event_name == 'workflow_dispatch' && inputs.run_full
    runs-on: [ self-hosted, linux ]
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run resource-capped formal verification
        run: scripts/verify-formal.sh all
