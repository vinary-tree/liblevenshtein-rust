[package]
name = "phonetic_spellcheck_wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly phonetic spellcheck demo"
license = "MIT"

# This package is its own workspace (not part of parent workspace)
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Core library with phonetic rules
liblevenshtein = { path = "../..", features = ["phonetic-rules"] }

# WASM bindgen for browser target (0.2.100 is stable, avoids externref issues in 0.2.106)
wasm-bindgen = "=0.2.100"

# Serialization for JS interop
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"

# Better panic messages in browser console
console_error_panic_hook = "0.1"

# RNG support for WASM (required by some deps)
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
wasm-bindgen-test = "=0.3.50"

[profile.release]
opt-level = "s"      # Optimize for size
lto = true
codegen-units = 1

[profile.release-speed]
inherits = "release"
opt-level = 3        # Optimize for speed (larger binary)
