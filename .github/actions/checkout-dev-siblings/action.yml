name: Checkout dev sibling crates
description: >
  Clone the in-development family repositories (vinary-tree-interop,
  javascript-runtime, liblevenshtein-npm, llattice, libdictenstein, lling-llang,
  and duallity) into the
  workspace parent directory so liblevenshtein's `path = "../..."` dependencies
  resolve against their development versions (mirroring the local checkout
  layout). Development jobs may select branches explicitly. Release jobs pass
  one validated manifest whose exact immutable tags override every individual
  ref input.

inputs:
  source-ref-manifest:
    description: >
      Repository-relative JSON manifest containing a sourceRefs object. When
      present, it is the exclusive source of every sibling ref and individual
      ref inputs are ignored.
    required: false
    default: ""
  ref:
    description: >
      Baseline development ref. An official pull request or branch whose head
      name starts with release/ selects that same coordinated branch for every
      non-llattice sibling unless an explicit per-owner ref is supplied.
    required: false
    default: master
  llattice-ref:
    description: Exact llattice ref; defaults to `ref`.
    required: false
    default: "v0.1.0"
  libdictenstein-ref:
    description: Exact libdictenstein ref; defaults to `ref`.
    required: false
    default: ""
  lling-llang-ref:
    description: Exact lling-llang ref; defaults to `ref`.
    required: false
    default: ""
  duallity-ref:
    description: Exact duallity ref; defaults to `ref`.
    required: false
    default: ""
  interop-ref:
    description: Exact vinary-tree-interop ref; defaults to `ref`.
    required: false
    default: ""
  javascript-runtime-ref:
    description: Exact javascript-runtime ref; defaults to `ref`.
    required: false
    default: ""
  liblevenshtein-npm-ref:
    description: Exact liblevenshtein-npm compatibility ref; defaults to `ref`.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Clone sibling crates into the workspace parent
      shell: bash
      env:
        SOURCE_REF_MANIFEST: ${{ inputs.source-ref-manifest }}
        BASELINE_REF: ${{ inputs.ref }}
        LLATTICE_REF: ${{ inputs.llattice-ref }}
        LIBDICTENSTEIN_REF: ${{ inputs.libdictenstein-ref }}
        LLING_LLANG_REF: ${{ inputs.lling-llang-ref }}
        DUALLITY_REF: ${{ inputs.duallity-ref }}
        INTEROP_REF: ${{ inputs.interop-ref }}
        JAVASCRIPT_RUNTIME_REF: ${{ inputs.javascript-runtime-ref }}
        LIBLEVENSHTEIN_NPM_REF: ${{ inputs.liblevenshtein-npm-ref }}
      run: |
        set -euo pipefail
        # The main repo is checked out at $GITHUB_WORKSPACE; its parent is where
        # related path dependencies resolve to. The order is dependency order:
        # libdictenstein consumes llattice, lling-llang consumes both dictionary
        # crates, and duallity consumes the three lower layers.
        parent="$(dirname "$GITHUB_WORKSPACE")"
        manifest="$SOURCE_REF_MANIFEST"
        if [ -n "$manifest" ]; then
          if [[ "$manifest" != /* ]]; then
            manifest="$GITHUB_WORKSPACE/$manifest"
          fi
          test -f "$manifest"
        fi
        event_ref="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-}}"
        if [[ "$event_ref" == release/* ]]; then
          development_ref="$event_ref"
        else
          development_ref="$BASELINE_REF"
        fi
        git check-ref-format --branch "$development_ref" >/dev/null
        for repo in vinary-tree-interop javascript-runtime liblevenshtein-npm llattice libdictenstein lling-llang duallity; do
          if [ -n "$manifest" ]; then
            selected_ref="$(python3 "$GITHUB_WORKSPACE/scripts/release_source_refs.py" \
              --manifest "$manifest" --component "$repo")"
          else
            case "$repo" in
              vinary-tree-interop) selected_ref="$INTEROP_REF" ;;
              javascript-runtime) selected_ref="$JAVASCRIPT_RUNTIME_REF" ;;
              liblevenshtein-npm) selected_ref="$LIBLEVENSHTEIN_NPM_REF" ;;
              llattice) selected_ref="$LLATTICE_REF" ;;
              libdictenstein) selected_ref="$LIBDICTENSTEIN_REF" ;;
              lling-llang) selected_ref="$LLING_LLANG_REF" ;;
              duallity) selected_ref="$DUALLITY_REF" ;;
            esac
            if [ -z "$selected_ref" ]; then
              selected_ref="$development_ref"
            fi
          fi
          git check-ref-format --branch "$selected_ref" >/dev/null
          dest="$parent/$repo"
          if [ -d "$dest/.git" ]; then
            echo "::group::Updating $repo to $selected_ref"
            git -C "$dest" fetch --depth 1 origin "$selected_ref"
            git -C "$dest" checkout -f FETCH_HEAD
            echo "::endgroup::"
          else
            echo "::group::Cloning $repo @ $selected_ref"
            git clone --depth 1 --branch "$selected_ref" \
              "https://github.com/vinary-tree/$repo.git" "$dest"
            echo "::endgroup::"
          fi
        done
        echo "Sibling crates available under $parent:"
        ls -1d \
          "$parent"/llattice \
          "$parent"/vinary-tree-interop \
          "$parent"/javascript-runtime \
          "$parent"/liblevenshtein-npm \
          "$parent"/libdictenstein \
          "$parent"/lling-llang \
          "$parent"/duallity
