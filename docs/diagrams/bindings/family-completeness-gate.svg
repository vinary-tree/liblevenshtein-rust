<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="251px" preserveAspectRatio="none" style="width:2030px;height:251px;background:#FFFFFF;" version="1.1" viewBox="0 0 2030 251" width="2030px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><g class="title" data-source-line="13"><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="545.7949" x="739.0614" y="22.9951">Family-wide binding completeness &#8212; omissions become explicit cells</text></g><!--entity AXES--><g class="entity" data-qualified-name="AXES" data-source-line="15" id="ent0001"><rect fill="#BBDEFB" height="68.8906" rx="7" ry="7" style="stroke:#37474F;stroke-width:0.5;" width="197.126" x="7" y="76.8969"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="105.3008" x="17" y="99.892">Reviewed axes</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="149.126" x="17" y="116.1889">projects &#183; capabilities</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="177.126" x="17" y="132.4857">languages &#183; unit domains</text></g><!--entity GEN--><g class="entity" data-qualified-name="GEN" data-source-line="16" id="ent0002"><rect fill="#D1C4E9" height="68.8906" rx="7" ry="7" style="stroke:#37474F;stroke-width:0.5;" width="193.1543" x="265.13" y="76.8969"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="167.4941" x="275.13" y="99.892">Deterministic generator</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="173.1543" x="275.13" y="116.1889">validate roots, evidence,</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="148.6133" x="275.13" y="132.4857">identities, and proofs</text></g><!--entity MATRIX--><g class="entity" data-qualified-name="MATRIX" data-source-line="17" id="ent0003"><rect fill="#FFF9C4" height="68.8906" rx="7" ry="7" style="stroke:#37474F;stroke-width:0.5;" width="230.875" x="519.28" y="76.8969"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="137.9287" x="529.28" y="99.892">Cartesian inventory</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="66.835" x="529.28" y="116.1889">1 row per</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="210.875" x="529.28" y="132.4857">(project, language, capability)</text></g><!--entity EVIDENCE--><g class="entity" data-qualified-name="EVIDENCE" data-source-line="18" id="ent0004"><rect fill="#C8E6C9" height="134.0781" rx="7" ry="7" style="stroke:#37474F;stroke-width:0.5;" width="356.2256" x="811.16" y="44.2969"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="233.0234" x="821.16" y="67.292">Five independent evidence gates</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="821.16" y="83.5889">&#160;</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="187.0654" x="821.16" y="99.8857">1. idiomatic API + lifecycle</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="252.834" x="821.16" y="116.1826">2. conformance + property + stress</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="309.1143" x="821.16" y="132.4795">3. representative native/binding benchmark</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="336.2256" x="821.16" y="148.7764">4. API + intended examples + deployment docs</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="300.9111" x="821.16" y="165.0732">5. exact registry clean-consumer readback</text></g><!--entity GATE--><g class="entity" data-qualified-name="GATE" data-source-line="19" id="ent0005"><rect fill="#C5E1A5" height="68.8906" rx="7" ry="7" style="stroke:#37474F;stroke-width:0.5;" width="177.1719" x="1270.31" y="76.8969"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="155.7842" x="1280.31" y="99.892">Strict completion gate</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="157.1719" x="1280.31" y="116.1889">complete, or reviewed</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="138.6533" x="1280.31" y="132.4857">inapplicability proof</text></g><!--entity WORK--><g class="entity" data-qualified-name="WORK" data-source-line="20" id="ent0006"><rect fill="#CFD8DC" height="68.8906" rx="7" ry="7" style="stroke:#37474F;stroke-width:0.5;" width="209.6152" x="1776.86" y="76.8969"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="189.6152" x="1786.86" y="99.892">Next implementation wave</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="144.0811" x="1786.86" y="116.1889">ordered missing and</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="135.8779" x="1786.86" y="132.4857">audit-required cells</text></g><g class="entity" data-qualified-name="GMN12" data-source-line="29" id="ent0013"><path d="M1228.38,181.2069 L1228.38,221.4725 A0,0 0 0 0 1228.38,221.4725 L1489.4103,221.4725 A0,0 0 0 0 1489.4103,221.4725 L1489.4103,191.2069 L1479.4103,181.2069 L1362.9,181.2069 L1358.9,146.1469 L1354.9,181.2069 L1228.38,181.2069 A0,0 0 0 0 1228.38,181.2069" fill="#E8F5E9" style="stroke:#181818;stroke-width:0.5;"/><path d="M1479.4103,181.2069 L1479.4103,191.2069 L1489.4103,191.2069 L1479.4103,181.2069" fill="#E8F5E9" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="236.4819" x="1234.38" y="198.2738">&#8220;Directory exists&#8221; is not completion.</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="240.0303" x="1234.38" y="213.4066">&#8220;No row exists&#8221; is not inapplicability.</text></g><g class="entity" data-qualified-name="GMN15" data-source-line="34" id="ent0016"><path d="M1747.41,180.6369 L1747.41,236.0353 A0,0 0 0 0 1747.41,236.0353 L2015.9178,236.0353 A0,0 0 0 0 2015.9178,236.0353 L2015.9178,190.6369 L2005.9178,180.6369 L1885.67,180.6369 L1881.67,146.0869 L1877.67,180.6369 L1747.41,180.6369 A0,0 0 0 0 1747.41,180.6369" fill="#E3F2FD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2005.9178,180.6369 L2005.9178,190.6369 L2015.9178,190.6369 L2005.9178,180.6369" fill="#E3F2FD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="247.5078" x="1753.41" y="197.7038">Every completed wave adds reviewed</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="222.3774" x="1753.41" y="212.8366">evidence to the source model and</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="240.8174" x="1753.41" y="227.9694">regenerates the Cartesian inventory.</text></g><!--link AXES to GEN--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="22" id="lnk7"><path d="M204.46,111.3369 C224.31,111.3369 240.17,111.3369 259.95,111.3369" fill="none" id="AXES-to-GEN" style="stroke:#37474F;stroke-width:2;"/><polygon fill="#37474F" points="264.95,111.3369,255.95,107.3369,259.95,111.3369,255.95,115.3369,264.95,111.3369" style="stroke:#37474F;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link GEN to MATRIX--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="23" id="lnk8"><path d="M458.63,111.3369 C478.12,111.3369 493.81,111.3369 513.88,111.3369" fill="none" id="GEN-to-MATRIX" style="stroke:#37474F;stroke-width:2;"/><polygon fill="#37474F" points="518.88,111.3369,509.88,107.3369,513.88,111.3369,509.88,115.3369,518.88,111.3369" style="stroke:#37474F;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link MATRIX to EVIDENCE--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="24" id="lnk9"><path d="M750.18,111.3369 C769.58,111.3369 785.13,111.3369 805.7,111.3369" fill="none" id="MATRIX-to-EVIDENCE" style="stroke:#37474F;stroke-width:2;"/><polygon fill="#37474F" points="810.7,111.3369,801.7,107.3369,805.7,111.3369,801.7,115.3369,810.7,111.3369" style="stroke:#37474F;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link EVIDENCE to GATE--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="25" id="lnk10"><path d="M1167.62,111.3369 C1203.24,111.3369 1234.19,111.3369 1265.1,111.3369" fill="none" id="EVIDENCE-to-GATE" style="stroke:#37474F;stroke-width:2;"/><polygon fill="#37474F" points="1270.1,111.3369,1261.1,107.3369,1265.1,111.3369,1261.1,115.3369,1270.1,111.3369" style="stroke:#37474F;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link GATE to WORK--><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" data-link-type="dependency" data-source-line="26" id="lnk11"><path d="M1447.94,111.3369 C1538.72,111.3369 1675.23,111.3369 1771.51,111.3369" fill="none" id="GATE-to-WORK" style="stroke:#C62828;stroke-width:2;stroke-dasharray:7,7;"/><polygon fill="#C62828" points="1776.51,111.3369,1767.51,107.3369,1771.51,111.3369,1767.51,115.3369,1776.51,111.3369" style="stroke:#C62828;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="196.6948" x="1520.41" y="107.4038">unfinished cells remain visible</text></g></g></svg>