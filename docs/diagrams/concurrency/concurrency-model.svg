<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="350px" preserveAspectRatio="none" style="width:1073px;height:350px;background:#FFFFFF;" version="1.1" viewBox="0 0 1073 350" width="1073px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><g class="title" data-source-line="24"><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="601.7676" x="232.1162" y="22.9951">Concurrency model &#8212; dictionary reads grouped by synchronization strategy</text></g><!--cluster gfree--><g class="cluster" data-qualified-name="gfree" data-source-line="28" id="ent0002"><rect fill="#CFD8DC" height="232.19" rx="7" ry="7" style="stroke:#455A64;stroke-width:1;" width="651" x="7" y="104.5869"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="439.8516" x="112.5742" y="119.582">Wait-free / lock-free reads (immutable &#183; ArcSwap &#183; CAS)</text></g><!--cluster glock--><g class="cluster" data-qualified-name="glock" data-source-line="34" id="ent0006"><rect fill="#CFD8DC" height="215.89" rx="7" ry="7" style="stroke:#455A64;stroke-width:1;" width="361" x="698" y="112.7369"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="231.5879" x="762.7061" y="127.732">RwLock readers (parking_lot)</text></g><!--entity dat--><g class="entity" data-qualified-name="gfree.dat" data-source-line="29" id="ent0003"><rect fill="#E8F5E9" height="52.5938" rx="7" ry="7" style="stroke:#455A64;stroke-width:0.5;" width="276.4707" x="30.76" y="147.5869"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="114.3721" x="40.76" y="170.582">DoubleArrayTrie</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="256.4707" x="40.76" y="186.8789">immutable array &#183; O(1) reads &#183; static</text></g><!--entity ddu64--><g class="entity" data-qualified-name="gfree.ddu64" data-source-line="30" id="ent0004"><rect fill="#E8F5E9" height="52.5938" rx="7" ry="7" style="stroke:#455A64;stroke-width:0.5;" width="272.4033" x="341.8" y="147.5869"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="239.9072" x="351.8" y="170.582">DynamicDawgU64 (ArcSwap RCU)</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="252.4033" x="351.8" y="186.8789">per-node copy-on-write &#183; CAS writes</text></g><!--entity art--><g class="entity" data-qualified-name="gfree.art" data-source-line="31" id="ent0005"><rect fill="#E8F5E9" height="52.5938" rx="7" ry="7" style="stroke:#455A64;stroke-width:0.5;" width="302.8369" x="30.58" y="260.1869"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="282.8369" x="40.58" y="283.182">PersistentARTrie (mmap, disk-persisted)</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="273.8135" x="40.58" y="299.4789">dynamic &#183; lock-free CAS reads + writes</text></g><!--entity dd--><g class="entity" data-qualified-name="glock.dd" data-source-line="35" id="ent0007"><rect fill="#E8F5E9" height="36.2969" rx="7" ry="7" style="stroke:#455A64;stroke-width:0.5;" width="121.4385" x="722.28" y="155.7369"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="101.4385" x="732.28" y="178.732">DynamicDawg</text></g><!--entity sa--><g class="entity" data-qualified-name="glock.sa" data-source-line="36" id="ent0008"><rect fill="#E8F5E9" height="36.2969" rx="7" ry="7" style="stroke:#455A64;stroke-width:0.5;" width="137.4414" x="878.28" y="155.7369"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="117.4414" x="888.