<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="373px" preserveAspectRatio="none" style="width:1135px;height:373px;background:#FFFFFF;" version="1.1" viewBox="0 0 1135 373" width="1135px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><g class="title" data-source-line="15"><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="625.3516" x="251.5162" y="22.9951">Three automaton implementations &#8212; same position model, different trade-offs</text></g><!--entity M--><g class="entity" data-qualified-name="M" data-source-line="17" id="ent0001"><rect fill="#BBDEFB" height="52.5938" rx="7" ry="7" style="stroke:#1565C0;stroke-width:0.5;" width="406.0049" x="392.87" y="44.2969"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="97.6377" x="402.87" y="67.292">Shared model</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="386.0049" x="402.87" y="83.5889">position &#10216;i,e&#10217; &#183; subsumption &#8804;&#967; &#183; characteristic vector &#967;</text></g><!--entity L--><g class="entity" data-qualified-name="L" data-source-line="19" id="ent0002"><rect fill="#E3F2FD" height="101.4844" rx="7" ry="7" style="stroke:#1565C0;stroke-width:0.5;" width="372.7549" x="13.49" y="156.8869"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="221.8125" x="23.49" y="179.882">Lazy / parameterized   (default)</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="309.6475" x="23.49" y="196.1789">src/transducer/{query,state,transition,pool}</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="352.7549" x="23.49" y="212.4757">&#8226; states materialised on demand during the query</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="336.2461" x="23.49" y="228.7726">&#8226; one W-independent transition rule driven by &#967;</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="284.1699" x="23.49" y="245.0695">&#8226; best general default &#8212; no precompute</text></g><!--entity U--><g class="entity" data-qualified-name="U" data-source-line="20" id="ent0003"><rect fill="#E3F2FD" height="101.4844" rx="7" ry="7" style="stroke:#1565C0;stroke-width:0.5;" width="349.2598" x="421.24" y="156.8869"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="119.4922" x="431.24" y="179.882">Universal / eager</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="174.7676" x="431.24" y="196.1789">src/transducer/universal/</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="329.2598" x="431.24" y="212.4757">&#8226; parameter-free DFA precomputed once per k</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="238.3555" x="431.24" y="228.7726">&#8226; reused across every query word</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="310.8848" x="431.24" y="245.0695">&#8226; best when k is fixed and queries are many</text></g><!--entity G--><g class="entity" data-qualified-name="G" data-source-line="21" id="ent0004"><rect fill="#C5CAE9" height="101.4844" rx="7" ry="7" style="stroke:#1565C0;stroke-width:0.5;" width="291.1064" x="805.31" y="156.8869"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="152.6602" x="815.31" y="179.882">Generalized / runtime</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="192.6641" x="815.31" y="196.1789">src/transducer/generalized/</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="242.2861" x="815.31" y="212.4757">&#8226; OperationSet chosen at run time</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="271.1064" x="815.31" y="228.7726">&#8226; drives weighted f64 &amp; phonetic edits</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="267.1621" x="815.31" y="245.0695">&#8226; +10-20% overhead for full flexibility</text></g><g class="entity" data-qualified-name="GMN8" data-source-line="28" id="ent0009"><path d="M6,318.3669 L6,358.6325 A0,0 0 0 0 6,358.6325 L393.7358,358.6325 A0,0 0 0 0 393.7358,358.6325 L393.7358,328.3669 L383.7358,318.3669 L203.87,318.3669 L199.87,258.8269 L195.87,318.3669 L6,318.3669 A0,0 0 0 0 6,318.3669" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M383.7358,318.3669 L383.7358,328.3669 L393.7358,328.3669 L383.7358,318.3669" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="366.7358" x="12" y="335.4338">Algorithm &#8712; { Standard, Transposition, MergeAndSplit }</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="238.0435" x="12" y="350.5666">selected as a zero-cost marker type.</text></g><g class="entity" data-qualified-name="GMN11" data-source-line="32" id="ent0012"><path d="M781.36,318.3669 L781.36,358.6325 A0,0 0 0 0 781.36,358.6325 L1120.3839,358.6325 A0,0 0 0 0 1120.3839,358.6325 L1120.3839,328.3669 L1110.3839,318.3669 L954.87,318.3669 L950.87,258.8269 L946.87,318.3669 L781.36,318.3669 A0,0 0 0 0 781.36,318.3669" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1110.3839,318.3669 L1110.3839,328.3669 L1120.3839,328.3669 L1110.3839,318.3669" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="256.5532" x="787.36" y="335.4338">Indigo tint = also backs the real-valued</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="318.0239" x="787.36" y="350.5666">(OperationCostsF64) and articulatory cost paths.</text></g><!--link M to L--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="23" id="lnk5"><path d="M520.45,97.3069 C471.53,113.9869 410.8825,134.6733 351.9325,154.7733" fill="none" id="M-to-L" style="stroke:#37474F;stroke-width:2;"/><polygon fill="#37474F" points="347.2,156.3869,357.0093,157.2683,351.9325,154.7733,354.4275,149.6964,347.2,156.3869" style="stroke:#37474F;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link M to U--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" data-link-type="dependency" data-source-line="24" id="lnk6"><path d="M595.87,97.3069 C595.87,113.9869 595.87,131.2869 595.87,151.3869" fill="none" id="M-to-U" style="stroke:#37474F;stroke-width:2;"/><polygon fill="#37474F" points="595.87,156.3869,599.87,147.3869,595.87,151.3869,591.87,147.3869,595.87,156.3869" style="stroke:#37474F;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link M to G--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" data-link-type="dependency" data-source-line="25" id="lnk7"><path d="M663.48,97.3069 C707.33,113.9869 761.2666,134.5095 814.1166,154.6095" fill="none" id="M-to-G" style="stroke:#37474F;stroke-width:2;"/><polygon fill="#37474F" points="818.79,156.3869,811.7998,149.4488,814.1166,154.6095,808.9559,156.9263,818.79,156.3869" style="stroke:#37474F;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/></g></g></svg>