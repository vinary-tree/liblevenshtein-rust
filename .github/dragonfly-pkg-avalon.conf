# Direct official DragonFly package repository. The AUTO mirrorlist may be
# unavailable even when Avalon's package catalog is healthy; unlike AUTO,
# this URL is a package repository rather than a mirrorlist endpoint.
# https://www.dragonflybsd.org/mirrors/
Avalon: {
    url: https://avalon.dragonflybsd.org/dports/${ABI}/LATEST
    mirror_type: NONE
    enabled: yes
}

AUTO: {
    enabled: no
}
