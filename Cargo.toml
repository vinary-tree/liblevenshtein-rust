[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = true  # Enable debug symbols for profiling

[profile.bench]
inherits = "release"

[features]
default = ["parking_lot"]
pathmap-backend = ["pathmap"]
serialization = ["serde", "bincode", "serde_json"]
protobuf = ["prost", "bytes", "prost-build", "serialization"]
compression = ["flate2", "serialization"]
cli = ["clap", "anyhow", "rustyline", "colored", "dirs", "pathmap-backend", "serialization"]
phonetic-rules = ["unicode-normalization"]  # Phonetic rewrite rules with formal verification
embedded-rules = ["phonetic-rules"]  # Pre-compiled English phonetic rules embedded in binary
parallel-grep = ["rayon", "phonetic-rules"]  # Parallel phonetic grep with Rayon for multi-core document scanning
perf-instrumentation = []  # Performance instrumentation for optimization analysis (dev only)

# Eviction wrapper optimization features
eviction-parking-lot = ["parking_lot"]
eviction-dashmap = ["dashmap"]
eviction-arc-str = []
eviction-compact-metadata = []
eviction-coarse-timestamps = []

# Eviction optimization profiles
eviction-opt-none = []
eviction-opt-balanced = ["eviction-parking-lot", "eviction-arc-str", "eviction-compact-metadata"]
eviction-opt-concurrent = ["eviction-dashmap", "eviction-parking-lot", "eviction-arc-str", "eviction-compact-metadata"]
eviction-opt-memory = ["eviction-compact-metadata"]

# SIMD optimization with AVX2/SSE4.1 intrinsics (Phase 3)
simd = []

# SCDAWG optimization experiments (Phase 4)
scdawg-bloom = []  # 64-bit bloom filter for edge lookup fast-reject
scdawg-simd = []   # SIMD edge lookup for small edge counts

# Persistent Adaptive Radix Trie (disk-based dictionary)
persistent-artrie = ["memmap2", "parking_lot", "serde", "bincode"]

# Grep compression support (gzip, zstd, xz, bzip2)
grep-compression = ["flate2", "zstd", "xz2", "bzip2"]
# Archive support for grep (tar, zip) - implies compression for .tar.gz etc.
grep-archives = ["tar", "zip", "globset", "grep-compression"]
# Full grep features (phonetic + parallel + compression + archives)
grep-full = ["phonetic-rules", "parallel-grep", "grep-compression", "grep-archives", "grep-documents"]

# Document extraction features for grep
grep-pdf = ["pdf-extract", "gag"]
grep-pdf-ocr = ["grep-pdf", "leptess"]
grep-docx = ["docx-rs"]
grep-xlsx = ["calamine"]
grep-epub = ["epub"]
grep-odt = ["quick-xml", "zip"]
grep-documents = ["grep-pdf", "grep-docx", "grep-xlsx", "grep-epub", "grep-odt"]

# WASM support - enables wasm-bindgen bindings for JavaScript
wasm = ["wasm-bindgen", "serde-wasm-bindgen", "console_error_panic_hook", "getrandom", "js-sys", "serde", "serde_json"]
# WASM with full phonetic support
wasm-phonetic = ["wasm", "phonetic-rules"]
# C FFI support - exposes raw C-compatible functions (for WASI or native FFI)
ffi = []
# Combined WASM + FFI
wasm-ffi = ["wasm", "ffi"]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/liblevenshtein", dest = "/usr/bin/liblevenshtein", mode = "755" },
    { source = "target/release/libliblevenshtein.so", dest = "/usr/lib64/libliblevenshtein.so", mode = "644", doc = false },
    { source = "target/release/libliblevenshtein.rlib", dest = "/usr/lib64/libliblevenshtein.rlib", mode = "644", doc = false },
    { source = "README.md", dest = "/usr/share/doc/liblevenshtein/README.md", mode = "644", doc = true },
    { source = "CHANGELOG.md", dest = "/usr/share/doc/liblevenshtein/CHANGELOG.md", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
glibc = "*"

