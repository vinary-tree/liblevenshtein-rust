name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        feature-set: [default, all]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-dev-siblings
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - if: matrix.feature-set == 'default'
        run: cargo test --locked
      - if: matrix.feature-set == 'all'
        run: cargo test --locked --all-features
      - if: matrix.feature-set == 'all'
        run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - if: matrix.feature-set == 'all'
        run: cargo test --locked --manifest-path liblevenshtein-macros/Cargo.toml --all-features
      - if: matrix.feature-set == 'all'
        run: cargo build --locked --examples --all-features
      - run: cargo fmt --all --check

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans sources licenses

  wasm:
    name: WASM build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-dev-siblings
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo check --locked --target wasm32-unknown-unknown --features wasm

  benchmarks:
    name: Benchmark compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-dev-siblings
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo build --locked --benches --all-features

  downstream-boundary:
    name: Library dependency boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-dev-siblings
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo tree --locked --all-features --edges normal
      - name: Reject application-only packages
        run: |
          if cargo tree --locked --all-features --edges normal |
             grep -E ' (clap|rustyline|quick-xml|pdf-extract|calamine|docx-rs|leptess|tar|zip|zstd|xz2|bzip2) v'; then
            echo "application-only dependency leaked into liblevenshtein" >&2
            exit 1
          fi

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-dev-siblings
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --all-features --no-deps
