<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="567px" preserveAspectRatio="none" style="width:793px;height:567px;background:#FFFFFF;" version="1.1" viewBox="0 0 793 567" width="793px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><g class="title" data-source-line="18"><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="544.7422" x="120.8773" y="22.9951">WallBreaker &#8212; pigeonhole filtering   (shown: k = 2 &#8658; k+1 = 3 pieces)</text></g><!--entity P--><g class="entity" data-qualified-name="P" data-source-line="20" id="ent0001"><rect fill="#B2EBF2" height="36.2969" rx="6" ry="6" style="stroke:#455A64;stroke-width:0.5;" width="165.0039" x="119.27" y="44.2969"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="145.0039" x="129.27" y="67.292">Pattern  P   (|P| = m)</text></g><!--entity p1--><g class="entity" data-qualified-name="p1" data-source-line="23" id="ent0002"><rect fill="#C8E6C9" height="52.5938" rx="6" ry="6" style="stroke:#455A64;stroke-width:0.5;" width="69.5879" x="61.98" y="158.9969"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="14.0547" x="71.98" y="181.992">P&#8321;</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="49.5879" x="71.98" y="198.2889">(exact)</text></g><!--entity p2--><g class="entity" data-qualified-name="p2" data-source-line="24" id="ent0003"><rect fill="#FFCDD2" height="52.5938" rx="6" ry="6" style="stroke:#455A64;stroke-width:0.5;" width="71.1602" x="166.19" y="158.9969"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="14.0547" x="176.19" y="181.992">P&#8322;</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="51.1602" x="176.19" y="198.2889">(1 edit)</text></g><!--entity p3--><g class="entity" data-qualified-name="p3" data-source-line="25" id="ent0004"><rect fill="#C8E6C9" height="52.5938" rx="6" ry="6" style="stroke:#455A64;stroke-width:0.5;" width="69.5879" x="271.98" y="158.9969"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="14.0547" x="281.98" y="181.992">P&#8323;</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="49.5879" x="281.98" y="198.2889">(exact)</text></g><g class="entity" data-qualified-name="GMN5" data-source-line="28" id="ent0006"><path d="M377.05,157.5969 L377.05,181.2969 L341.97,185.2969 L377.05,189.2969 L377.05,212.9953 A0,0 0 0 0 377.05,212.9953 L778.4968,212.9953 A0,0 0 0 0 778.4968,212.9953 L778.4968,167.5969 L768.4968,157.5969 L377.05,157.5969 A0,0 0 0 0 377.05,157.5969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M768.4968,157.5969 L768.4968,167.5969 L778.4968,167.5969 L768.4968,157.5969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="319.3125" x="383.05" y="174.6638">With &#8804; k edits spread across k+1 disjoint pieces,</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="380.4468" x="383.05" y="189.7966">by the pigeonhole principle at least one piece (here P&#8321;, P&#8323;)</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="124.0142" x="383.05" y="204.9294">must be error-free.</text></g><!--entity M--><g class="entity" data-qualified-name="M" data-source-line="33" id="ent0008"><rect fill="#C8E6C9" height="52.5938" rx="6" ry="6" style="stroke:#455A64;stroke-width:0.5;" width="376.2686" x="13.64" y="273.9969"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="356.2686" x="23.64" y="296.992">Locate the error-free piece exactly in the SCDAWG</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="246.1211" x="23.64" y="313.2889">O(|P&#7522;|) &#8212; no wall, no prefix blow-up</text></g><!--entity E--><g class="entity" data-qualified-name="E" data-source-line="34" id="ent0009"><rect fill="#E1BEE7" height="52.5938" rx="6" ry="6" style="stroke:#455A64;stroke-width:0.5;" width="389.5439" x="7" y="387.5869"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="228.6758" x="17" y="410.582">Extend the match bidirectionally</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="369.5439" x="17" y="426.8789">(left &#8592; and &#8594; right) within the remaining edit budget</text></g><!--entity V--><g class="entity" data-qualified-name="V" data-source-line="35" id="ent0010"><rect fill="#C8E6C9" height="52.5938" rx="6" ry="6" style="stroke:#455A64;stroke-width:0.5;" width="222.7676" x="90.39" y="501.1869"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="144.874" x="100.39" y="524.182">Verify total edits &#8804; k</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="202.7676" x="100.39" y="540.4789">&#8594; candidate (term, distance)</text></g><!--link P to p2--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" data-link-type="dependency" data-source-line="37" id="lnk11"><path d="M201.77,81.0169 C201.77,101.4469 201.77,130.3269 201.77,153.6769" fill="none" id="P-to-p2" style="stroke:#00838F;stroke-width:2;"/><polygon fill="#00838F" points="201.77,158.6769,205.77,149.6769,201.77,153.6769,197.77,149.6769,201.77,158.6769" style="stroke:#00838F;stroke-width:2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" len