name: Checkout portable sibling crates
description: >
  Place development sibling sources inside the repository so cross-runtime and
  VM jobs that mount only GITHUB_WORKSPACE test the same revisions as native CI.

runs:
  using: composite
  steps:
    - uses: actions/checkout@v6
      with:
        repository: vinary-tree/vinary-tree-interop
        path: vendor/vinary-tree-interop
        persist-credentials: false
    - uses: actions/checkout@v6
      with:
        repository: vinary-tree/llattice
        path: vendor/llattice
        persist-credentials: false
    - uses: actions/checkout@v6
      with:
        repository: vinary-tree/libdictenstein
        path: vendor/libdictenstein
        persist-credentials: false
    - name: Point development dependencies at workspace-local vendor trees
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        from pathlib import Path

        manifest = Path("Cargo.toml")
        before = manifest.read_text()
        after = before.replace(
            'path = "../libdictenstein"',
            'path = "vendor/libdictenstein"',
            1,
        )
        after = after.replace(
            'path = "../vinary-tree-interop"',
            'path = "vendor/vinary-tree-interop"',
            1,
        )
        if after == before:
            raise SystemExit("development dependency paths were not found")
        manifest.write_text(after)
        PY
        cargo generate-lockfile
