# Dependency update automation.
#
# A fleet-wide OSV sweep in 2026-07 found this tree several months behind and
# carrying five advisories, two of them denial-of-service issues that arrived
# pinned inside document-format dependencies. deny.toml + the `supply-chain` CI
# job detect that state; this file is what keeps it from recurring.
#
# Grouped so this opens a couple of reviewable PRs per week rather than thirty
# single-crate ones -- ungrouped Dependabot output is reliably ignored.
version: 2

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      compatible:
        applies-to: version-updates
        update-types: ["patch", "minor"]
      security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # bincode 3.0.0 is a tombstone release containing only a compiler error.
      # Cargo.toml pins `<3` and deny.toml bans `>=3.0.0`.
      - dependency-name: "bincode"
        versions: [">=3.0.0"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(ci)"
