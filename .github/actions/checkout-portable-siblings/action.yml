name: Checkout portable sibling crates
description: >
  Place development sibling sources inside the repository so cross-runtime and
  VM jobs that mount only GITHUB_WORKSPACE test the same revisions as native CI.

inputs:
  ref:
    description: >
      Baseline development ref. The triggering branch is selected for each
      mutable sibling where that exact remote branch exists.
    required: false
    default: master
  llattice-ref:
    description: Immutable llattice release ref.
    required: false
    default: v0.1.0
  interop-ref:
    description: Explicit vinary-tree-interop ref; defaults to the coordinated ref.
    required: false
    default: ""
  libdictenstein-ref:
    description: Explicit libdictenstein ref; defaults to the coordinated ref.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - id: source-refs
      name: Select and validate portable sibling refs
      shell: bash
      env:
        BASELINE_REF: ${{ inputs.ref }}
        LLATTICE_REF: ${{ inputs.llattice-ref }}
        INTEROP_REF: ${{ inputs.interop-ref }}
        LIBDICTENSTEIN_REF: ${{ inputs.libdictenstein-ref }}
      run: |
        set -euo pipefail
        event_ref="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-}}"
        mutable_ref="$BASELINE_REF"
        interop_ref="$INTEROP_REF"
        libdictenstein_ref="$LIBDICTENSTEIN_REF"
        if [ -z "$interop_ref" ] && [ -n "$event_ref" ] && \
          git ls-remote --exit-code --heads \
            https://github.com/vinary-tree/vinary-tree-interop.git \
            "$event_ref" >/dev/null 2>&1
        then
          interop_ref="$event_ref"
        fi
        if [ -z "$libdictenstein_ref" ] && [ -n "$event_ref" ] && \
          git ls-remote --exit-code --heads \
            https://github.com/vinary-tree/libdictenstein.git \
            "$event_ref" >/dev/null 2>&1
        then
          libdictenstein_ref="$event_ref"
        fi
        interop_ref="${interop_ref:-$mutable_ref}"
        libdictenstein_ref="${libdictenstein_ref:-$mutable_ref}"
        for ref in "$interop_ref" "$LLATTICE_REF" "$libdictenstein_ref"; do
          git check-ref-format --branch "$ref" >/dev/null
        done
        {
          echo "interop=$interop_ref"
          echo "llattice=$LLATTICE_REF"
          echo "libdictenstein=$libdictenstein_ref"
        } >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@v6
      with:
        repository: vinary-tree/vinary-tree-interop
        ref: ${{ steps.source-refs.outputs.interop }}
        path: vendor/vinary-tree-interop
        persist-credentials: false
    - uses: actions/checkout@v6
      with:
        repository: vinary-tree/llattice
        ref: ${{ steps.source-refs.outputs.llattice }}
        path: vendor/llattice
        persist-credentials: false
    - uses: actions/checkout@v6
      with:
        repository: vinary-tree/libdictenstein
        ref: ${{ steps.source-refs.outputs.libdictenstein }}
        path: vendor/libdictenstein
        persist-credentials: false
    - name: Point development dependencies at workspace-local vendor trees
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        from pathlib import Path

        manifest = Path("Cargo.toml")
        before = manifest.read_text()
        after = before.replace(
            'path = "../libdictenstein"',
            'path = "vendor/libdictenstein"',
            1,
        )
        after = after.replace(
            'path = "../vinary-tree-interop"',
            'path = "vendor/vinary-tree-interop"',
            1,
        )
        if after == before:
            raise SystemExit("development dependency paths were not found")
        manifest.write_text(after)

        # Each sibling ends its package manifest with an empty `[workspace]`
        # sentinel so a normal standalone checkout cannot be captured by an
        # unrelated parent workspace. Portable CI intentionally nests these
        # copies below this workspace, where retaining those sentinels would
        # create multiple workspace roots. Remove only that verified empty
        # terminal table from the vendored copies; no package fields or path
        # dependency semantics are rewritten.
        for portable_root in (
            "vendor/libdictenstein",
            "vendor/llattice",
            "vendor/vinary-tree-interop",
        ):
            sibling_manifest = Path(portable_root, "Cargo.toml")
            sibling = sibling_manifest.read_text()
            prefix, marker, suffix = sibling.rpartition("\n[workspace]\n")
            if not marker or suffix.strip():
                raise SystemExit(
                    f"{sibling_manifest} does not end in an empty workspace table"
                )
            sibling_manifest.write_text(prefix.rstrip() + "\n")
        PY
        cargo generate-lockfile
