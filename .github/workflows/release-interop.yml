name: Release shared interop ABI

on:
  push:
    tags: ["interop-v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Verify canonical shared ABI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - run: python3 scripts/generate-bindings.py --check
      - uses: ./.github/actions/checkout-dev-siblings
        with:
          llattice-ref: v0.1.0
          libdictenstein-ref: v0.2.1
          lling-llang-ref: v0.2.0
          duallity-ref: v0.3.0
      - uses: dtolnay/rust-toolchain@1.95
      - name: Verify generated mirrors, layouts, and release tag
        shell: bash
        run: |
          cargo test -p vinary-tree-interop
          cargo clippy -p vinary-tree-interop -- -D warnings
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' vinary-tree-interop/Cargo.toml | head -n 1)
            test "interop-v$version" = "$GITHUB_REF_NAME"
          fi

  native-package:
    name: Header-only C/C++ package
    needs: contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - run: scripts/stage-interop-native-package.sh dist
      - name: Verify relocatable CMake and pkg-config metadata
        shell: bash
        run: |
          prefix=$(find dist -mindepth 1 -maxdepth 1 -type d -name 'vinary-tree-interop-*' -print -quit)
          test -f "$prefix/include/vinary_tree_interop.h"
          test -f "$prefix/lib/cmake/vinary-tree-interop/vinary-tree-interopConfig.cmake"
          test -f "$prefix/lib/pkgconfig/vinary-tree-interop.pc"
      - uses: actions/upload-artifact@v7
        with:
          name: native-package
          path: dist/*.tar.gz
          if-no-files-found: error

  python-package:
    name: Python package
    needs: contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-python@v6
        with: { python-version: "3.14" }
      - run: python -m pip install build
      - run: python -m build --wheel --sdist --outdir ../../../dist
        working-directory: vinary-tree-interop/bindings/python
      - run: python -m pip install dist/*.whl
      - uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: dist/*
          if-no-files-found: error

  npm-package:
    name: npm package
    needs: contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: "24", package-manager-cache: false }
      - run: npm test
        working-directory: vinary-tree-interop/bindings/javascript
      - run: npm pack --pack-destination ../../../dist
        working-directory: vinary-tree-interop/bindings/javascript
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: dist/*.tgz
          if-no-files-found: error

  jvm-package:
    name: JVM FFM resource package
    needs: contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "25", cache: gradle }
      - name: Test, document, and stage Maven artifact
        run: >-
          bindings/jvm/gradlew --no-daemon
          -p vinary-tree-interop/bindings/jvm
          test javadoc publishMavenJavaPublicationToStagingRepository
      - uses: actions/upload-artifact@v7
        with:
          name: maven-staging
          path: vinary-tree-interop/bindings/jvm/build/staging-deploy
          if-no-files-found: error

  nuget-package:
    name: NuGet package
    needs: contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: 10.0.x }
      - name: Build and pack net8/net10 resource layouts
        run: |
          project=bindings/dotnet/src/VinaryTree.Interop
          dotnet restore "$project" -p:NuGetAudit=false -m:1
          dotnet pack "$project" --configuration Release --no-restore \
            --output "$PWD/dist" -p:BuildInParallel=false
      - uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: dist/*.nupkg
          if-no-files-found: error

  hackage-package:
    name: Hackage package
    needs: contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: haskell-actions/setup@v2
        with: { ghc-version: "9.14.1", cabal-version: latest }
      - name: Check, build, and stage source distribution
        working-directory: vinary-tree-interop/bindings/haskell
        run: |
          cabal check
          cabal build -fstrict
          cabal sdist --ignore-project --output-directory=../../../dist
      - uses: actions/upload-artifact@v7
        with:
          name: hackage-package
          path: dist/*.tar.gz
          if-no-files-found: error

  fpm-package:
    name: fpm package
    needs: contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: fortran-lang/setup-fpm@v10
      - name: Validate registry source tree
        run: |
          scripts/stage-fpm-package.sh interop "$RUNNER_TEMP/fpm-package"
          fpm build -C "$RUNNER_TEMP/fpm-package" --dump fpm_model.json
          fpm publish -C "$RUNNER_TEMP/fpm-package" --token validation --dry-run

  opam-package:
    name: opam source package
    needs: contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: ocaml/setup-ocaml@v3
        with: { ocaml-compiler: "5.4.0" }
      - name: Stage, build, and lint standalone package
        run: |
          scripts/stage-interop-ocaml-package.sh "$RUNNER_TEMP/opam-package"
          opam lint "$RUNNER_TEMP/opam-package/opam"
          tar -xjf "$RUNNER_TEMP/opam-package/vinary-tree-interop-0.1.0.tbz" -C "$RUNNER_TEMP/opam-package"
          dune build --root "$RUNNER_TEMP/opam-package/vinary-tree-interop-0.1.0" @install @runtest
      - uses: actions/upload-artifact@v7
        with:
          name: opam-package
          path: |
            ${{ runner.temp }}/opam-package/opam
            ${{ runner.temp }}/opam-package/vinary-tree-interop-0.1.0.tbz
          if-no-files-found: error

  crates-io:
    name: Publish Rust crate
    needs: [native-package, python-package, npm-package, jvm-package]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    environment: crates-io-interop
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: ./.github/actions/checkout-dev-siblings
        with:
          llattice-ref: v0.1.0
          libdictenstein-ref: v0.2.1
          lling-llang-ref: v0.2.0
          duallity-ref: v0.3.0
      - uses: dtolnay/rust-toolchain@1.95
      - run: cargo publish -p vinary-tree-interop
        env: { CARGO_REGISTRY_TOKEN: "${{ secrets.CARGO_REGISTRY_TOKEN }}" }

  pypi:
    name: Publish PyPI package
    needs: python-package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    environment: pypi-interop
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@v7
        with: { name: python-package, path: dist }
      - uses: pypa/gh-action-pypi-publish@release/v1.14
        with: { packages-dir: dist }

  npm:
    name: Publish npm package
    needs: npm-package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    environment: npm-interop
    permissions: { id-token: write }
    steps:
      - uses: actions/setup-node@v6
        with: { node-version: "24", registry-url: "https://registry.npmjs.org", package-manager-cache: false }
      - uses: actions/download-artifact@v7
        with: { name: npm-package, path: dist }
      - run: npm publish --access public --provenance dist/*.tgz

  maven-central:
    name: Publish Maven package
    needs: jvm-package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    environment: maven-central-interop
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/download-artifact@v7
        with: { name: maven-staging, path: vinary-tree-interop/bindings/jvm/build/staging-deploy }
      - uses: jreleaser/release-action@v2
        with:
          version: 1.25.0
          arguments: deploy
          working-directory: vinary-tree-interop/bindings/jvm
        env:
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.MAVEN_GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.MAVEN_GPG_SECRET_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  nuget:
    name: Publish NuGet package
    needs: nuget-package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    environment: nuget-interop
    steps:
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: 10.0.x }
      - uses: actions/download-artifact@v7
        with: { name: nuget-package, path: dist }
      - run: >-
          dotnet nuget push dist/VinaryTree.Interop.*.nupkg
          --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
        env: { NUGET_API_KEY: "${{ secrets.NUGET_API_KEY }}" }

  hackage:
    name: Publish Hackage package
    needs: hackage-package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    environment: hackage-interop
    steps:
      - uses: haskell-actions/setup@v2
        with: { ghc-version: "9.14.1", cabal-version: latest }
      - uses: actions/download-artifact@v7
        with: { name: hackage-package, path: dist }
      - run: >-
          cabal upload --publish --username="$HACKAGE_USERNAME"
          --password="$HACKAGE_PASSWORD" dist/*.tar.gz
        env:
          HACKAGE_USERNAME: ${{ secrets.HACKAGE_USERNAME }}
          HACKAGE_PASSWORD: ${{ secrets.HACKAGE_PASSWORD }}

  fpm:
    name: Publish fpm package
    needs: fpm-package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    environment: fpm-interop
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: fortran-lang/setup-fpm@v10
      - run: |
          scripts/stage-fpm-package.sh interop "$RUNNER_TEMP/fpm-package"
          fpm build -C "$RUNNER_TEMP/fpm-package" --dump fpm_model.json
          fpm publish -C "$RUNNER_TEMP/fpm-package" --token "$FPM_REGISTRY_TOKEN"
        env: { FPM_REGISTRY_TOKEN: "${{ secrets.FPM_REGISTRY_TOKEN }}" }

  go-module:
    name: Publish Go module tag
    needs: contract
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    environment: go-module-interop
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-go@v6
        with: { go-version: "1.26.x" }
      - name: Verify and create immutable module tag
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          GOWORK=off go -C vinary-tree-interop/bindings/go test ./...
          version=${GITHUB_REF_NAME#interop-v}
          module_tag="vinary-tree-interop/bindings/go/v$version"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$module_tag" >/dev/null 2>&1; then
            echo "tag already exists: $module_tag" >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/refs" --method POST \
            -f "ref=refs/tags/$module_tag" -f "sha=$GITHUB_SHA"

  github-release:
    name: Publish common ABI release and checksums
    needs:
      - native-package
      - python-package
      - npm-package
      - jvm-package
      - nuget-package
      - hackage-package
      - opam-package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v7
        with: { name: native-package, path: assets }
      - uses: actions/download-artifact@v7
        with: { name: python-package, path: assets }
      - uses: actions/download-artifact@v7
        with: { name: npm-package, path: assets }
      - uses: actions/download-artifact@v7
        with: { name: nuget-package, path: assets }
      - uses: actions/download-artifact@v7
        with: { name: hackage-package, path: assets }
      - uses: actions/download-artifact@v7
        with: { name: opam-package, path: assets }
      - uses: actions/download-artifact@v7
        with: { name: maven-staging, path: assets/maven }
      - name: Flatten Maven files and hash assets
        run: |
          mkdir -p flattened-assets
          find assets/maven -type f \( -name '*.jar' -o -name '*.pom' \) -exec cp {} flattened-assets/ \;
          find flattened-assets -type f -exec cp {} assets/ \;
          rm -rf assets/maven
          cd assets
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > ../SHA256SUMS
          mv ../SHA256SUMS SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with: { files: "assets/*", generate_release_notes: true }

  opam:
    name: Submit package to opam-repository
    needs: [opam-package, github-release]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    environment: opam-interop
    steps:
      - uses: actions/download-artifact@v7
        with: { name: opam-package, path: dist }
      - name: Create opam-repository pull request
        shell: bash
        env: { GH_TOKEN: "${{ secrets.OPAM_GITHUB_TOKEN }}" }
        run: |
          account=$(gh api user --jq .login)
          if ! gh repo view "$account/opam-repository" >/dev/null 2>&1; then
            gh repo fork ocaml/opam-repository --clone=false
          fi
          for attempt in 1 2 3 4 5 6; do
            if gh repo view "$account/opam-repository" >/dev/null 2>&1; then break; fi
            test "$attempt" -ne 6
            sleep 5
          done
          gh repo clone "$account/opam-repository" opam-repository
          git -C opam-repository fetch https://github.com/ocaml/opam-repository.git master
          version=${GITHUB_REF_NAME#interop-v}
          branch="vinary-tree-interop-$version-$GITHUB_RUN_ID"
          git -C opam-repository checkout -b "$branch" FETCH_HEAD
          package="opam-repository/packages/vinary-tree-interop/vinary-tree-interop.$version"
          mkdir -p "$package"
          cp dist/opam "$package/opam"
          git -C opam-repository config user.name "Vinary Tree release automation"
          git -C opam-repository config user.email "dylon.devo@gmail.com"
          git -C opam-repository add "packages/vinary-tree-interop/vinary-tree-interop.$version/opam"
          git -C opam-repository commit -m "Package vinary-tree-interop $version"
          git -C opam-repository push origin "$branch"
          gh pr create --repo ocaml/opam-repository --base master \
            --head "$account:$branch" --title "Package vinary-tree-interop $version" \
            --body "Automated submission of the tested Vinary Tree shared ABI package."
