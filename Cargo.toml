[workspace]
members = ["."]
# The proc-macro crate depends on this package to reuse the phonetic parser. Building both as
# workspace members makes Cargo compile two root-package units that emit the same fixed-name
# cdylib artifacts. Keep the macro crate independently verified instead of accepting collisions.
exclude = ["examples/phonetic_spellcheck", "liblevenshtein-macros"]
resolver = "2"

[package]
name = "liblevenshtein"
version = "4.0.0-rc.6"
autobins = false
edition = "2021"
# Matches the libdictenstein path dependency, whose --all-features floor is set by
# sysinfo 0.39 (1.95). The previous 1.70 was already false: libdictenstein pulls
# pathmap 0.2.2 (1.88) and bincode 2.0.1 / lru 0.18 (1.85).
rust-version = "1.95"
authors = ["Dylon Edwards <dylon.devo@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/vinary-tree/liblevenshtein-rust"
exclude = ["docs/", "examples/"]
description = "Levenshtein/Universal Automata for approximate string matching using various dictionary backends"
keywords = ["levenshtein", "edit-distance", "spell-checking", "fuzzy-search", "automata"]
categories = ["algorithms", "data-structures", "text-processing"]
readme = "README.md"

[dependencies]
# Stable C-compatible resource and provider ABI shared by the modular
# vinary-tree language bindings. Keep this crate generic and dependency-free so
# libdictenstein, liblevenshtein, lling-llang, and duallity can exchange live
# objects without a Rust dynamic-library ABI dependency.
vinary-tree-interop = { path = "../vinary-tree-interop-regresspec-complete", version = "=4.0.0-rc.6", optional = true }

# Dictionary implementations (extracted to libdictenstein crate)
libdictenstein = { path = "../libdictenstein-regresspec-complete", version = "=4.0.0-rc.6", features = ["parking_lot"] }

# PathMap as an optional dictionary backend
# NOTE: PathMap uses a git dependency and is NOT available when installing from crates.io
# To use PathMap, build from source: cargo install --git <repo-url> --features pathmap-backend
# pathmap = { git = "https://github.com/Adam-Vandervorst/PathMap.git", branch = "master", optional = true }
pathmap = { version = ">=0.2.2, <0.4", optional = true }
# SmallVec for stack-allocated vectors (performance optimization)
smallvec = { version = "1.13", features = ["serde"] }
# Arena allocation for PathNode (performance optimization)
typed-arena = { version = "2.0", optional = true }
# Fast non-cryptographic hashing for internal use
rustc-hash = "2.1"
# Per-cache keyed hashing for adversarially supplied query text without the
# latency cost of the standard library's SipHash-based RandomState.
ahash = "0.8"
# Lock-free atomic Arc swapping for DynamicDawgU64
arc-swap = "1.7"
# Error handling
thiserror = "2.0"
# Faster RwLock for DynamicDawg (Phase 1) and eviction wrappers (optional)
parking_lot = { version = "0.12", optional = true }
# Lock-free concurrent hashmap for eviction wrappers (optional)
dashmap = { version = "6.1", optional = true }
# Serialization support (optional)
serde = { version = "1.0", features = ["derive", "rc"], optional = true }
# `bincode-next`, declared under the name `bincode` via a Cargo package rename so
# no call site changes. The original `bincode` is unmaintained with no fixed
# version (RUSTSEC-2025-0141) -- it was abandoned after a doxxing/harassment
# incident and its own 3.0.0 is a tombstone containing only a compiler error --
# so the advisory can only be closed by leaving the crate. Byte compatibility was
# verified empirically: a probe depending on bincode 1.3, 2.0 and bincode-next 3
# simultaneously produced identical `config::legacy()` output.
bincode = { package = "bincode-next", version = "3", features = ["serde"], optional = true }
prost = { version = "0.14", optional = true }
bytes = { version = "1.5", optional = true }
flate2 = { version = "1.0", optional = true }
# Random number generation for corpus utilities (test/benchmark use)
# 0.9.3 is the floor for RUSTSEC-2026-0097 (unsound with a custom logger using
# `rand::rng()`). 0.9 rather than 0.10 so this shares proptest's copy.
rand = { version = "0.9.3", optional = true }
# Parallel support for the reusable in-memory phonetic grep engines
rayon = { version = "1.11", optional = true }
# Unicode normalization for accent-insensitive matching and (?u:NFC) flag
unicode-normalization = { version = "0.1", optional = true }
# Memory-mapped I/O for persistent data structures
# Floor 0.9.11 excludes RUSTSEC-2026-0186 (unchecked pointer offset).
memmap2 = { version = "0.9.11", optional = true }
# SIMD optimization uses std::arch (no external dependencies needed)

# WASM bindings (optional, for browser/Node.js targets)
# Note: Use =0.2.100 to avoid externref issues in newer versions
wasm-bindgen = { version = "=0.2.100", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
getrandom = { version = "0.4", features = ["wasm_js"], optional = true }
# Ahash still resolves getrandom 0.3. Feature unification is version-specific,
# so enable that release line's browser backend explicitly as well.
getrandom-03 = { package = "getrandom", version = "0.3", features = ["wasm_js"], optional = true }
js-sys = { version = "0.3", optional = true }

[dev-dependencies]
criterion = "0.8"
tempfile = "3.8"
proptest = "1.4"
rayon = "1.11"
num_cpus = "1.16"

[build-dependencies]
prost-build = { version = "0.14", optional = true }

[lib]
name = "liblevenshtein"
path = "src/lib.rs"
# Rust consumers use the rlib; native packages ship both shared and static C ABI libraries.
crate-type = ["rlib", "cdylib", "staticlib"]

