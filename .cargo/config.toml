# Cargo configuration for liblevenshtein.
#
# Release artifacts deliberately use each Rust target's portable CPU baseline.
# Never set target-cpu=native here: doing so can emit instructions unavailable
# on another Intel/AMD machine and makes cross-compilation non-reproducible.

[target.wasm32-unknown-unknown]
# getrandom 0.3+ removed the `js` feature; the web/JS backend is now selected
# by the `getrandom_backend="wasm_js"` cfg in addition to the crate's `wasm_js`
# feature (enabled in Cargo.toml). Required for `--features wasm` to build for
# wasm32-unknown-unknown.
rustflags = ["--cfg", "getrandom_backend=\"wasm_js\""]

# Developers may opt into local-machine-only benchmark builds with
# `RUSTFLAGS="-C target-cpu=native" cargo bench`; shipped libraries must not.

# Cargo aliases for code coverage (requires cargo-llvm-cov: cargo install cargo-llvm-cov)
[alias]
cov = "llvm-cov --branch --all-features --html --output-dir coverage/"
cov-text = "llvm-cov --branch --all-features --text"
cov-open = "llvm-cov --branch --all-features --html --open"

# Academic benchmark aliases. These assume corpora have already been prepared
# under target/academic-benchmarks; use scripts/run-academic-benchmarks.sh for
# download/extract/cleanup orchestration and memory-capped execution.
academic-msm-ucr-summary = "run --release --example msm_experiment -- ucr-archive-summary 0 0 target/academic-benchmarks/msm/Univariate_ts 1000000000 1000"
academic-msm-ucr = "run --release --example msm_experiment -- ucr-archive-1nn 0 0 target/academic-benchmarks/msm/Univariate_ts 1000000000 1000"
academic-phonetic-cmudict = "run --release --features phonetic-rules,embedded-rules --example scientific_eval -- --workload cmudict-phonetic --cmudict target/academic-benchmarks/phonetic/cmudict.dict --corpus-limit 2048 --samples 2048 --warmups 0 --max-distance 2 --recall-k 5 --phonetic-dialect en-us-cmudict"
academic-phonetic-cmudict-diagnostic = "run --release --features phonetic-rules,embedded-rules --example scientific_eval -- --workload cmudict-phonetic-diagnostic --cmudict target/academic-benchmarks/phonetic/cmudict.dict --corpus-limit 2048 --diagnostic-limit 2048 --max-distance 2 --recall-k 5 --phonetic-dialect en-us-cmudict"
