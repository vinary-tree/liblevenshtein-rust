name: Nightly Tests and Benchmarks

on:
  schedule:
    # Run at 2 AM UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  nightly-matrix:
    name: Nightly Build & Test ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rustflags: "-C target-feature=+aes,+sse2"

          - name: macOS ARM64
            os: macos-latest
            target: aarch64-apple-darwin
            rustflags: "-C target-feature=+aes,+neon"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout dev sibling crates
        uses: ./.github/actions/checkout-dev-siblings

      - name: Register Tesseract Repository (Linux)
        if: runner.os == 'Linux'
        run: sudo add-apt-repository ppa:alex-p/tesseract-ocr5

      - name: Update package index (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update
  
      - name: Install protobuf compiler (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y protobuf-compiler
  
      - name: Install protobuf compiler (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf
  
      - name: Install Leptonica (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libleptonica-dev
  
      - name: Install Leptonica (macOS)
        if: runner.os == 'macOS'
        run: brew install leptonica

      - name: Install Tesseract (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y tesseract-ocr libtesseract-dev
  
      - name: Install Tesseract (macOS)
        if: runner.os == 'macOS'
        run: brew install tesseract

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          target: ${{ matrix.platform.target }}

      - name: Build liblevenshtein
        env:
          RUSTFLAGS: ${{ matrix.platform.rustflags }}
        run: |
          echo "::group::Building liblevenshtein"
          cargo build --release --all-features --target ${{ matrix.platform.target }} --verbose
          echo "::endgroup::"

      - name: Run all tests
        env:
          RUSTFLAGS: ${{ matrix.platform.rustflags }}
        run: |
          echo "::group::Running all tests"
          cargo test --all-features --target ${{ matrix.platform.target }} --verbose -- --nocapture
          echo "::endgroup::"

      - name: Verify procedural-macro workspace
        env:
          RUSTFLAGS: ${{ matrix.platform.rustflags }}
        run: |
          echo "::group::Testing liblevenshtein-macros"
          cargo test --manifest-path liblevenshtein-macros/Cargo.toml --all-features --target ${{ matrix.platform.target }} --verbose
          echo "::endgroup::"

      - name: Compile-check benchmarks
        if: runner.os == 'Linux'
        env:
          RUSTFLAGS: ${{ matrix.platform.rustflags }}
        # Build every bench target (dev profile, no LTO) to catch bench rot.
        # The full statistical `cargo bench` run is release+LTO over ~50 benches
        # and takes hours (far beyond this job's timeout), so it is intentionally
        # not run in CI; perf measurement is done deliberately and CPU-pinned
        # locally (see the project's benchmarking methodology).
        run: cargo build --benches --all-features --target ${{ matrix.platform.target }}

      - name: Report nightly failure
        if: runner.os == 'Linux' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔥 Nightly Build Failed - ${{ matrix.platform.name }}',
              body: 'The nightly build has failed. Please investigate.\n\nWorkflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}',
              labels: ['nightly-failure', 'ci']
            })

  code-coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout dev sibling crates
        uses: ./.github/actions/checkout-dev-siblings

      - name: Register Tesseract Repository (Linux)
        if: runner.os == 'Linux'
        run: sudo add-apt-repository ppa:alex-p/tesseract-ocr5

      - name: Update package index (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update
  
      - name: Install protobuf compiler (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y protobuf-compiler
  
      - name: Install protobuf compiler (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf
  
      - name: Install Leptonica (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libleptonica-dev
  
      - name: Install Leptonica (macOS)
        if: runner.os == 'macOS'
        run: brew install leptonica

      - name: Install Tesseract (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y tesseract-ocr libtesseract-dev
  
      - name: Install Tesseract (macOS)
        if: runner.os == 'macOS'
        run: brew install tesseract

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov

      - name: Generate code coverage
        env:
          RUSTFLAGS: "-C target-feature=+aes,+sse2"
        run: cargo llvm-cov --branch --all-features --workspace --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  dependency-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout dev sibling crates
        uses: ./.github/actions/checkout-dev-siblings

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        run: cargo audit

      - name: Check for outdated dependencies
        run: |
          cargo install cargo-outdated
          cargo outdated --exit-code 1 || echo "Some dependencies are outdated"

  nightly-summary:
    name: Nightly Summary
    runs-on: ubuntu-latest
    needs: [nightly-matrix, code-coverage, dependency-audit]
    if: always()

    steps:
    - name: Download benchmark results
      if: needs.nightly-matrix.result == 'success'
      uses: actions/download-artifact@v4
      with:
        pattern: nightly-benchmarks-*
        path: ./benchmark-results
        merge-multiple: true
      continue-on-error: true

    - name: Generate summary
      run: |
        echo "## Nightly Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Nightly Matrix | ${{ needs.nightly-matrix.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Code Coverage | ${{ needs.code-coverage.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Security Audit | ${{ needs.dependency-audit.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [ "${{ needs.nightly-matrix.result }}" == "success" ]; then
          echo "✅ Nightly tests passed!" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Nightly tests failed!" >> $GITHUB_STEP_SUMMARY
        fi

        echo "" >> $GITHUB_STEP_SUMMARY

        # Include benchmark summary if available
        if [ -f "./benchmark-results/benchmark-summary.md" ]; then
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat ./benchmark-results/benchmark-summary.md >> $GITHUB_STEP_SUMMARY
        fi
