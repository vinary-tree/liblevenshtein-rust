acing" textLength="134.7637" x="96.05" y="734.3589">candidate superset</text></g><!--entity Verify--><g class="entity" data-qualified-name="Verify" data-source-line="21" id="ent0007"><rect fill="#F8BBD0" height="52.5938" rx="6" ry="6" style="stroke:#37474F;stroke-width:0.5;" width="267.1943" x="134.05" y="824.6569"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="178.582" x="144.05" y="847.652">Exact original verification</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="247.1943" x="144.05" y="863.9489">authoritative membership and cost</text></g><!--entity Metric--><g class="entity" data-qualified-name="Metric" data-source-line="22" id="ent0008"><rect fill="#DCEDC8" height="52.5938" rx="6" ry="6" style="stroke:#37474F;stroke-width:0.5;" width="192.7715" x="43.27" y="954.2569"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="172.7715" x="53.27" y="977.252">Metric-qualified instance</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="170.5293" x="53.27" y="993.5489">domain/quotient axioms</text></g><!--entity Nonmetric--><g class="entity" data-qualified-name="Nonmetric" data-source-line="23" id="ent0009"><rect fill="#FFCDD2" height="52.5938" rx="6" ry="6" style="stroke:#37474F;stroke-width:0.5;" width="250.3779" x="271.46" y="954.2569"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="230.3779" x="281.46" y="977.252">Nonmetric ordered-cost instance</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="179.0059" x="281.46" y="993.5489">for example banded DTW</text></g><g class="entity" data-qualified-name="GMN19" data-source-line="36" id="ent0020"><path d="M440.82,562.6669 L440.82,586.3669 L405.63,590.3669 L440.82,594.3669 L440.82,618.0653 A0,0 0 0 0 440.82,618.