<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="527px" preserveAspectRatio="none" style="width:2542px;height:527px;background:#FFFFFF;" version="1.1" viewBox="0 0 2542 527" width="2542px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><g class="title" data-source-line="27"><text fill="#000000" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="684.7285" x="925.1357" y="22.9951">Concurrency model &#8212; every dictionary reads lock-free (a reader never blocks a writer)</text></g><!--cluster gmem--><g class="cluster" data-qualified-name="gmem" data-source-line="31" id="ent0002"><rect fill="#CFD8DC" height="406.98" rx="7" ry="7" style="stroke:#455A64;stroke-width:1;" width="1217" x="7" y="106.8969"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="314.4805" x="458.2598" y="121.892">In-memory &#8212; lock-free / wait-free reads</text></g><!--cluster gdisk--><g class="cluster" data-qualified-name="gdisk" data-source-line="41" id="ent0010"><rect fill="#CFD8DC" height="272.58" rx="7" ry="7" style="stroke:#455A64;stroke-width:1;" width="684" x="1844" y="104.5969"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="361.1904" x="2005.4048" y="119.592">Disk-persisted &#8212; durable AND lock-free reads</text></g><!--entity dat--><g class="entity" data-qualified-name="gmem.dat" data-source-line="32" id="ent0003"><rect fill="#E8F5E9" height="64.2969" rx="7" ry="7" style="stroke:#455A64;stroke-width:0.5;" width="373.3652" x="31.32" y="149.8969"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="158.2793" x="41.32" y="172.892">DoubleArrayTrie(Char)</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="125.8018" x="41.32" y="200.892">immutable array &#183;</text><image height="28" width="50" x="171.572" xlink:href="data:image/svg+xml;base64," y="176.1937"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="168.6631" x="226.0221" y="200.892">reads &#183; static (wait-free)</text></g><!--entity dd--><g class="entity" data-qualified-name="gmem.dd" data-source-line="33" id="ent0004"><rect fill="#E8F5E9" height="52.5938" rx="7" ry="7" style="stroke:#455A64;stroke-width:0.5;" width="353.3135" x="439.34" y="155.7469"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="288.4629" x="449.34" y="178.742">DynamicDawg(Char) / DynamicDawgU64</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="333.3135" x="449.34" y="195.0389">LockFreeDawg &#183; per-node ArcSwap &#183; CAS writes</text></g><!--entity sa--><g class="entity" data-qualified-name="gmem.sa" data-source-line="34" id="ent0005"><rect fill="#E8F5E9" height="52.5938" rx="7" ry="7" style="stroke:#455A64;stroke-width:0.5;" width="353.4229" x="827.29" y="155.7469"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="161.3486" x="837.29" y="178.742">SuffixAutomaton(Char)</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="333.4229" x="837.29" y="195.0389">LockFreeSuffixAutomaton &#183; ArcSwap &#183; substring</text></g><!--entity sc--><g class="entity" data-qualified-name="gmem.sc" data-source-line="35" id="ent0006"><rect fill="#E8F5E9" height="52.5938" rx="7" ry="7" style="stroke:#455A64;stroke-width:0.5;" width="312.0313" x="66.98" y="300.5869"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="98.2939" x="76.98" y="323.582">Scdawg(Char)</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="292.0313" x="76.98" y="339.8789">LockFreeScdawg &#183; ArcSwap &#183; bidirectional</text></g><!--entity pmd--><g class="entity" data-qualified-name="gmem.pmd" data-source-line="36" id="ent0007"><rect fill="#E8F5E9" height="52.5938" rx="7" ry="7" style="stroke:#455A64;stroke-width:0.5;" width="398.1846" x="413.91" y="300.5869"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="176.6406" x="423.91" y="323.582">PathMapDictionary(Char)</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="378.1846" x="423.91" y="339.8789">Arc&lt;ArcSwap&lt;PathMapState&gt;&gt; &#183; atomic-swap writes</text></g><!--entity pms--><g class="entity" data-qualified-name="gmem.pms" data-source-line="37" id="ent0008"><rect fill="#E8F5E9" height="52.5938" rx="7" ry="7" style="stroke:#455A64;stroke-width:0.5;" width="288.0986" x="846.95" y="300.5869"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="268.0986" x="856.95" y="323.582">PathMapSnapshot / PathMapRef(Char)</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="239.1279" x="856.95" y="339.8789">persistent copy-on-write snapshot</text></g><!--entity bij--><g class="entity" data-qualified-name="gmem.bij" data-source-line="38" id="ent0009"><rect fill="#E8F5E9" height="52.5938" rx="7" ry="7" style="stroke:#455A64;stroke-width:0.5;" width="394.4932" x="30.75" y="437.2869"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="89.5166" x="40.75" y="460.282">BijectiveMap</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="374.4932" x="40.75" y="476.5789">lock-free DynamicDawgChar + ArcSwap reverse map</text></g><!--entity part--><g class="entity" data-qualified-name="gdisk.part" data-source-line="42" id="ent0011"><rect fill="#E0F2F1" height="52.5938" rx="7" ry="7" style="stroke:#455A64;stroke-width:0.5;" width="228.4277" x="1867.79" y="155.7469"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="201.4551" x="1877.79" y="178.742">PersistentARTrie(Char / U64)</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="208.4277" x="1877.79" y="195.0389">lock-free CAS overlay &#183; mmap</text></g><!--entity psub--><g class="entity" data-qualified-name="gdisk.psub" data-source-line="43" id="ent0012"><rect fill="#E0F2F1" height="68.8906" rx="7" ry="7" style="stroke:#455A64;stroke-width:0.5;" width="354.1201" x="2130.94" y="147.5969"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="334.1201" x="2140.94" y="170.592">PersistentScdawg / PersistentSuffixAutomaton /</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="184.9873" x="2140.94" y="186.8889">PersistentSuffixTree(Char)</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="217.5674" x="2140.94" y="203.1857">ArcSwap graph &#183; disk-persisted</text></g><!--entity pv--><g class="entity" data-qualified-name="gdisk.pv" data-source-line="44" id="ent0013"><rect fill="#E0F2F1" height="52.5938" rx="7" ry="7" style="stroke:#455A64;stroke-width:0.5;" width="259.4287" x="1868.29" y="300.5869"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="159.1748" x="1878.29" y="323.582">PersistentVocabARTrie</text><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="239.4287" x="1878.29" y="339.8789">lock-free overlay &#183; term &#8596; id &#183; disk</text></g><!--entity banner--><g class="entity" data-qualified-name="banner" data-source-line="29" id="ent0001"><rect fill="#CFD8DC" height="36.2969" rx="7" ry="7" style="stroke:#455A64;stroke-width:0.5;" width="466.3525" x="1634.82" y="44.2969"/><text fill="#102027" font-family="'DejaVu Sans'" font-size="14" lengthAdjust="spacing" textLength="446.3525" x="1644.82" y="67.292">All dictionaries: Send + Sync &#183; Arc cheap-clone &#183; lock-free reads</text></g><g class="entity" data-qualified-name="GMN14" data-source-line="48" id="ent0015"><path d="M1248.34,276.4869 L1248.34,377.2838 L1819.6691,377.2838 L1819.6691,286.4869 L1809.6691,276.4869 L1248.34,276.4869" fill="#FFF3E0" style="stroke:#EF6C00;stroke-width:0.5;"/><path d="M1809.6691,276.4869 L1809.6691,286.4869 L1819.6691,286.4869 L1809.6691,276.4869" fill="#FFF3E0" style="stroke:#EF6C00;stroke-width:1;"/><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="539.9126" x="1254.34" y="293.5538">Every in-memory backend reports SyncStrategy::InternalSync (PathMap snapshots</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="505.3242" x="1254.34" y="308.6866">report Persistent). Writers publish new state by an atomic ArcSwap swap or a</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="529.4453" x="1254.34" y="323.8194">compare_exchange CAS and never exclude readers. Earlier releases guarded the</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="550.3291" x="1254.34" y="338.9522">dynamic backends (DynamicDawg &#183; SuffixAutomaton &#183; Scdawg), PathMapDictionary,</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="537.729" x="1254.34" y="354.085">and BijectiveMap with a parking_lot RwLock; that RwLock now survives only inside</text><text fill="#000000" font-family="'DejaVu Sans'" font-size="13" lengthAdjust="spacing" textLength="481.6411" x="1254.34" y="369.2178">the disk-backed persistent_artrie engine, never on a dictionary read path.</text></g><!--link gmem to GMN14--><g class="link" data-entity-1="ent0002" data-entity-2="ent0015" data-link-type="association" data-source-line="48" id="lnk16"><path d="M1224.2507,186.7472 C1224.5075,186.8626 1224.7699,186.9804 1225.0378,187.1007 C1226.1092,187.582 1227.2684,188.1028 1228.5112,188.6611 C1230.9969,189.7777 1233.8174,191.0446 1236.9398,192.4472 C1249.4297,198.0575 1266.7519,205.8381 1286.8138,214.8494 C1326.9375,232.8719 1378.02,255.8169 1423.32,276.1669" fill="none" id="gmem-GMN14" style="stroke:#37474F;stroke-width:2;stroke-dasharray:7,7;"/></g><!--link banner to gmem--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="56" id="lnk17"><path d="M1770.39,81.0569 C1680.155,97.3269 1543.01,122.0619 1427.7063,142.8581 C1370.0544,153.2563 1317.8628,162.6697 1279.7255,169.548 C1260.6568,172.9871 1245.1017,175.7925 1234.1344,177.7702 C1231.3925,178.2647 1228.9374,178.7074 1226.7859,179.0953 C1226.248,179.1923 1225.729,179.2859 1225.2294,179.376 C1224.9795,179.421 1229.6551,178.578 1229.4149,178.6213" fill="none" id="banner-to-gmem" style="stroke:#455A64;stroke-width:3;"/><polygon fill="#455A64" points="1224.4943,179.5085,1234.0612,181.848,1229.4149,178.6213,1232.6417,173.975,1224.4943,179.5085" style="stroke:#455A64;stroke-width:3;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link banner to gdisk--><g class="link" data-entity-1="ent0001" data-entity-2="ent0010" data-link-type="dependency" data-source-line="57" id="lnk18"><path d="M2101.32,66.0469 C2275.28,69.0469 2485.45,75.3969 2501,88.5969 C2504.935,91.9369 2508.1892,95.8545 2510.8706,100.1571 C2511.541,101.2328 2512.1755,102.3325 2512.776,103.4532 C2512.9261,103.7334 2510.7818,99.5713 2510.9276,99.8541" fill="none" id="banner-to-gdisk" style="stroke:#455A64;stroke-width:3;"/><polygon fill="#455A64" points="2513.2199,104.2977,2512.6487,94.4654,2510.9276,99.8541,2505.539,98.1331,2513.2199,104.2977" style="stroke:#455A64;stroke-width:3;stroke-linejoin:miter;stroke-miterlimit:10;"/></g></g></svg>