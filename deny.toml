# cargo-deny configuration for liblevenshtein.
#
# Audit the complete optional library surface.
#
#     cargo deny check
#
# Mirrors the configuration in the libdictenstein repository; keep them in step.

[graph]
all-features = true

[advisories]
yanked = "deny"

ignore = []

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "BSL-1.0",
  "MPL-2.0",
  "CC0-1.0",
  "Unlicense",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
# "warn", and deliberately so -- this is a settled decision, not a pending ratchet.
#
# libdictenstein sets this to "deny" with an enumerated skip list, because it has
# only a handful of duplicates and they are stable. That does not transfer here:
# this tree's duplicates are dominated by proc-macro ecosystem churn (syn, quote,
# proc-macro2, shlex, rustc-hash) plus transitive pins in upstream crates, none of
# which are resolvable from this manifest. A skip list would need an entry per
# duplicate and an edit on every routine dependency bump -- maintenance friction
# that buys no additional safety, since a genuinely new duplicate would simply be
# appended to it by whoever hit the failure.
#
# Change this to "deny" if and when the duplicate count falls to a handful that
# stays stable across updates, as it did for libdictenstein.
multiple-versions = "warn"
wildcards = "deny"

deny = [
  # The abandoned crate itself, at any version. We use `bincode-next`, the
  # maintained fork, declared under the name `bincode` via a package rename --
  # so this ban catches a transitive dependency dragging the real one back in.
  { crate = "bincode", reason = "unmaintained (RUSTSEC-2025-0141); 3.0.0 is a tombstone containing only a compiler error. Use the maintained `bincode-next` fork." },
  { crate = "paste", reason = "unmaintained (RUSTSEC-2024-0436); use `pastey`" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
